<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出品 — WINE BANK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: { DEFAULT: '#C9A96E', hover: '#B8860B' },
            dark: { 900: '#0A0A0A', 800: '#141414', 700: '#1C1C1C', 600: '#252525', 500: '#2F2F2F' }
          },
          fontFamily: {
            serif: ['Cormorant Garamond', 'serif'],
            sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
    .input-field { background: #1C1C1C; border: 1px solid rgba(255,255,255,0.1); color: #fff; }
    .input-field:focus { border-color: #C9A96E; box-shadow: 0 0 0 2px rgba(201,169,110,0.15); outline: none; }
    .input-field::placeholder { color: rgba(255,255,255,0.25); }
    select.input-field option { background: #1C1C1C; color: #fff; }
    .btn-gold { background: linear-gradient(135deg, #C9A96E, #B8860B); color: #0A0A0A; font-weight: 700; transition: all 0.3s; }
    .btn-gold:hover { background: linear-gradient(135deg, #B8860B, #96720B); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(201,169,110,0.3); }
    .btn-gold:disabled { opacity: 0.5; transform: none; box-shadow: none; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease; }
    .slot-area { border-color: rgba(255,255,255,0.1); }
    .slot-area:hover { border-color: rgba(201,169,110,0.5); background: rgba(201,169,110,0.05); }
  </style>
</head>
<body class="bg-dark-900 min-h-screen">

  <!-- ヘッダー -->
  <header class="bg-dark-800/95 backdrop-blur border-b border-white/5 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4">
      <div class="flex items-center h-14 gap-3">
        <a href="/" class="text-white/40 hover:text-gold p-1 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <a href="/" class="flex items-center gap-2">
          <span class="font-serif text-gold text-lg font-semibold tracking-wider">WINE BANK</span>
        </a>
        <span class="font-medium text-white/90 ml-1 text-sm">出品</span>
      </div>
    </div>
  </header>

  <div class="max-w-5xl mx-auto px-4 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

      <!-- フォーム（左2列） -->
      <div class="lg:col-span-2">
        <div id="errorBox" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-xl px-4 py-3 mb-4"></div>

        <form onsubmit="handleSubmit(event)" class="space-y-5">

          <!-- ワイン基本情報 -->
          <div class="bg-dark-700 rounded-xl border border-white/5 p-6">
            <h2 class="font-serif text-gold text-lg mb-5 tracking-wide">Wine Information</h2>

            <!-- 複数画像アップロード -->
            <div class="mb-6">
              <label class="block text-sm font-medium text-white/70 mb-1">ワイン写真 <span class="text-xs text-white/30">（最大6枚）</span></label>
              <p class="text-xs text-white/30 mb-3">正面・背面（裏ラベル）・キャップシールの3枚以上を推奨。最初の1枚がメイン画像になります。</p>

              <div class="grid grid-cols-3 gap-3" id="imageSlots">
                <!-- 正面 -->
                <div class="image-slot" data-slot="0" data-label="正面">
                  <div class="slot-area border-2 border-dashed rounded-xl aspect-square flex flex-col items-center justify-center cursor-pointer transition relative overflow-hidden"
                    onclick="triggerSlot(0)">
                    <div class="slot-placeholder text-center p-2">
                      <svg class="w-8 h-8 mx-auto mb-1 text-white/20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><circle cx="12" cy="13" r="3"/></svg>
                      <p class="text-xs text-white/40 font-medium">正面</p>
                      <p class="text-xs text-white/20">メイン</p>
                    </div>
                    <div class="slot-preview hidden w-full h-full absolute inset-0">
                      <img src="" alt="" class="slot-img w-full h-full object-cover">
                      <button type="button" onclick="removeSlot(event,0)" class="absolute top-1.5 right-1.5 bg-dark-900/80 text-white/60 hover:text-white rounded-full w-6 h-6 flex items-center justify-center text-xs border border-white/10 transition">✕</button>
                    </div>
                    <div class="slot-loading hidden absolute inset-0 bg-dark-700/80 flex items-center justify-center">
                      <div class="w-5 h-5 border-2 border-gold/30 border-t-gold rounded-full animate-spin"></div>
                    </div>
                  </div>
                </div>
                <!-- 背面 -->
                <div class="image-slot" data-slot="1" data-label="背面（裏ラベル）">
                  <div class="slot-area border-2 border-dashed rounded-xl aspect-square flex flex-col items-center justify-center cursor-pointer transition relative overflow-hidden"
                    onclick="triggerSlot(1)">
                    <div class="slot-placeholder text-center p-2">
                      <svg class="w-8 h-8 mx-auto mb-1 text-white/20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a4 4 0 014-4z"/></svg>
                      <p class="text-xs text-white/40 font-medium">背面</p>
                      <p class="text-xs text-white/20">裏ラベル</p>
                    </div>
                    <div class="slot-preview hidden w-full h-full absolute inset-0">
                      <img src="" alt="" class="slot-img w-full h-full object-cover">
                      <button type="button" onclick="removeSlot(event,1)" class="absolute top-1.5 right-1.5 bg-dark-900/80 text-white/60 hover:text-white rounded-full w-6 h-6 flex items-center justify-center text-xs border border-white/10 transition">✕</button>
                    </div>
                    <div class="slot-loading hidden absolute inset-0 bg-dark-700/80 flex items-center justify-center">
                      <div class="w-5 h-5 border-2 border-gold/30 border-t-gold rounded-full animate-spin"></div>
                    </div>
                  </div>
                </div>
                <!-- キャップシール -->
                <div class="image-slot" data-slot="2" data-label="キャップシール">
                  <div class="slot-area border-2 border-dashed rounded-xl aspect-square flex flex-col items-center justify-center cursor-pointer transition relative overflow-hidden"
                    onclick="triggerSlot(2)">
                    <div class="slot-placeholder text-center p-2">
                      <svg class="w-8 h-8 mx-auto mb-1 text-white/20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                      <p class="text-xs text-white/40 font-medium">キャップ</p>
                      <p class="text-xs text-white/20">シール</p>
                    </div>
                    <div class="slot-preview hidden w-full h-full absolute inset-0">
                      <img src="" alt="" class="slot-img w-full h-full object-cover">
                      <button type="button" onclick="removeSlot(event,2)" class="absolute top-1.5 right-1.5 bg-dark-900/80 text-white/60 hover:text-white rounded-full w-6 h-6 flex items-center justify-center text-xs border border-white/10 transition">✕</button>
                    </div>
                    <div class="slot-loading hidden absolute inset-0 bg-dark-700/80 flex items-center justify-center">
                      <div class="w-5 h-5 border-2 border-gold/30 border-t-gold rounded-full animate-spin"></div>
                    </div>
                  </div>
                </div>
                <!-- 追加スロット 3-5 -->
                <div class="image-slot" data-slot="3" data-label="追加写真1">
                  <div class="slot-area border-2 border-dashed rounded-xl aspect-square flex flex-col items-center justify-center cursor-pointer transition relative overflow-hidden"
                    onclick="triggerSlot(3)">
                    <div class="slot-placeholder text-center p-2">
                      <div class="text-xl mb-1 text-white/15">＋</div>
                      <p class="text-xs text-white/25">追加</p>
                    </div>
                    <div class="slot-preview hidden w-full h-full absolute inset-0">
                      <img src="" alt="" class="slot-img w-full h-full object-cover">
                      <button type="button" onclick="removeSlot(event,3)" class="absolute top-1.5 right-1.5 bg-dark-900/80 text-white/60 hover:text-white rounded-full w-6 h-6 flex items-center justify-center text-xs border border-white/10 transition">✕</button>
                    </div>
                    <div class="slot-loading hidden absolute inset-0 bg-dark-700/80 flex items-center justify-center">
                      <div class="w-5 h-5 border-2 border-gold/30 border-t-gold rounded-full animate-spin"></div>
                    </div>
                  </div>
                </div>
                <div class="image-slot" data-slot="4" data-label="追加写真2">
                  <div class="slot-area border-2 border-dashed rounded-xl aspect-square flex flex-col items-center justify-center cursor-pointer transition relative overflow-hidden"
                    onclick="triggerSlot(4)">
                    <div class="slot-placeholder text-center p-2">
                      <div class="text-xl mb-1 text-white/15">＋</div>
                      <p class="text-xs text-white/25">追加</p>
                    </div>
                    <div class="slot-preview hidden w-full h-full absolute inset-0">
                      <img src="" alt="" class="slot-img w-full h-full object-cover">
                      <button type="button" onclick="removeSlot(event,4)" class="absolute top-1.5 right-1.5 bg-dark-900/80 text-white/60 hover:text-white rounded-full w-6 h-6 flex items-center justify-center text-xs border border-white/10 transition">✕</button>
                    </div>
                    <div class="slot-loading hidden absolute inset-0 bg-dark-700/80 flex items-center justify-center">
                      <div class="w-5 h-5 border-2 border-gold/30 border-t-gold rounded-full animate-spin"></div>
                    </div>
                  </div>
                </div>
                <div class="image-slot" data-slot="5" data-label="追加写真3">
                  <div class="slot-area border-2 border-dashed rounded-xl aspect-square flex flex-col items-center justify-center cursor-pointer transition relative overflow-hidden"
                    onclick="triggerSlot(5)">
                    <div class="slot-placeholder text-center p-2">
                      <div class="text-xl mb-1 text-white/15">＋</div>
                      <p class="text-xs text-white/25">追加</p>
                    </div>
                    <div class="slot-preview hidden w-full h-full absolute inset-0">
                      <img src="" alt="" class="slot-img w-full h-full object-cover">
                      <button type="button" onclick="removeSlot(event,5)" class="absolute top-1.5 right-1.5 bg-dark-900/80 text-white/60 hover:text-white rounded-full w-6 h-6 flex items-center justify-center text-xs border border-white/10 transition">✕</button>
                    </div>
                    <div class="slot-loading hidden absolute inset-0 bg-dark-700/80 flex items-center justify-center">
                      <div class="w-5 h-5 border-2 border-gold/30 border-t-gold rounded-full animate-spin"></div>
                    </div>
                  </div>
                </div>
              </div>
              <input type="file" id="slotFileInput" accept="image/*" class="hidden">
            </div>

            <div class="mb-4">
              <label class="block text-sm font-medium text-white/60 mb-1.5">商品タイトル <span class="text-gold text-xs">*</span></label>
              <input type="text" id="title" required placeholder="例: Château Margaux 2015 750ml"
                class="input-field w-full rounded-xl px-4 py-2.5 text-sm transition" oninput="updatePreview()">
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
              <div>
                <label class="block text-sm font-medium text-white/60 mb-1.5">生産者 <span class="text-gold text-xs">*</span></label>
                <input type="text" id="producer" required placeholder="Château Margaux"
                  class="input-field w-full rounded-xl px-4 py-2.5 text-sm transition" oninput="updatePreview()">
              </div>
              <div>
                <label class="block text-sm font-medium text-white/60 mb-1.5">ヴィンテージ</label>
                <input type="number" id="vintage" placeholder="2015" min="1800" max="2030"
                  class="input-field w-full rounded-xl px-4 py-2.5 text-sm transition" oninput="updatePreview()">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
              <div>
                <label class="block text-sm font-medium text-white/60 mb-1.5">産地</label>
                <input type="text" id="region" placeholder="フランス / ボルドー"
                  class="input-field w-full rounded-xl px-4 py-2.5 text-sm transition">
              </div>
              <div>
                <label class="block text-sm font-medium text-white/60 mb-1.5">アペラシオン</label>
                <input type="text" id="appellation" placeholder="Margaux AOC 1er Grand Cru"
                  class="input-field w-full rounded-xl px-4 py-2.5 text-sm transition">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
              <div>
                <label class="block text-sm font-medium text-white/60 mb-1.5">ブドウ品種</label>
                <input type="text" id="grape" placeholder="Cab.S 87% / Merlot 8%"
                  class="input-field w-full rounded-xl px-4 py-2.5 text-sm transition">
              </div>
              <div>
                <label class="block text-sm font-medium text-white/60 mb-1.5">容量</label>
                <select id="volume_ml" class="input-field w-full rounded-xl px-4 py-2.5 text-sm transition">
                  <option value="375">375ml（ハーフ）</option>
                  <option value="750" selected>750ml（標準）</option>
                  <option value="1500">1500ml（マグナム）</option>
                  <option value="3000">3000ml（ジェロボアム）</option>
                </select>
              </div>
            </div>

            <div class="mb-4">
              <label class="block text-sm font-medium text-white/60 mb-2">ワインタイプ</label>
              <div class="flex gap-3">
                <label class="flex items-center gap-1.5 text-sm text-white/70 cursor-pointer"><input type="radio" name="wine_type" value="red" checked class="accent-gold"> 赤</label>
                <label class="flex items-center gap-1.5 text-sm text-white/70 cursor-pointer"><input type="radio" name="wine_type" value="white" class="accent-gold"> 白</label>
                <label class="flex items-center gap-1.5 text-sm text-white/70 cursor-pointer"><input type="radio" name="wine_type" value="sparkling" class="accent-gold"> スパークリング</label>
                <label class="flex items-center gap-1.5 text-sm text-white/70 cursor-pointer"><input type="radio" name="wine_type" value="rose" class="accent-gold"> ロゼ</label>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-white/60 mb-1.5">RPスコア</label>
                <input type="number" id="score_rp" placeholder="98" min="50" max="100"
                  class="input-field w-full rounded-xl px-4 py-2.5 text-sm transition">
              </div>
              <div>
                <label class="block text-sm font-medium text-white/60 mb-1.5">WSスコア</label>
                <input type="number" id="score_ws" placeholder="97" min="50" max="100"
                  class="input-field w-full rounded-xl px-4 py-2.5 text-sm transition">
              </div>
            </div>
          </div>

          <!-- 保管・状態 -->
          <div class="bg-dark-700 rounded-xl border border-white/5 p-6">
            <h2 class="font-serif text-gold text-lg mb-5 tracking-wide">Condition & Storage</h2>
            <div class="mb-4">
              <label class="block text-sm font-medium text-white/60 mb-1.5">保管状態 <span class="text-gold text-xs">*</span></label>
              <input type="text" id="condition_note" required placeholder="未開封 / 温度管理済みセラー保管"
                class="input-field w-full rounded-xl px-4 py-2.5 text-sm transition">
            </div>
            <div>
              <label class="block text-sm font-medium text-white/60 mb-1.5">商品説明</label>
              <textarea id="description" rows="4" placeholder="商品の詳細、保管履歴、購入経緯など"
                class="input-field w-full rounded-xl px-4 py-2.5 text-sm transition resize-none"></textarea>
            </div>
          </div>

          <!-- オークション設定 -->
          <div class="bg-dark-700 rounded-xl border border-white/5 p-6">
            <h2 class="font-serif text-gold text-lg mb-5 tracking-wide">Auction Settings</h2>

            <div class="grid grid-cols-2 gap-4 mb-4">
              <div>
                <label class="block text-sm font-medium text-white/60 mb-1.5">開始価格 <span class="text-gold text-xs">*</span></label>
                <div class="relative">
                  <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gold/60 text-sm">¥</span>
                  <input type="number" id="starting_price" required placeholder="50000" min="1" step="1"
                    class="input-field w-full rounded-xl pl-8 pr-3 py-2.5 text-sm transition" oninput="updatePreview()">
                </div>
              </div>
              <div>
                <label class="block text-sm font-medium text-white/60 mb-1.5">出品期間 <span class="text-gold text-xs">*</span></label>
                <select id="end_hours" required class="input-field w-full rounded-xl px-4 py-2.5 text-sm transition">
                  <option value="24">24時間</option>
                  <option value="48">48時間</option>
                  <option value="72" selected>72時間（3日）</option>
                  <option value="120">5日間</option>
                  <option value="168">7日間</option>
                </select>
              </div>
            </div>

            <div class="bg-gold/5 border border-gold/15 rounded-lg p-3 text-xs text-gold/70">
              <svg class="w-3.5 h-3.5 inline mr-1 -mt-0.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
              終了5分以内に入札があると自動的に5分延長されます（スナイプ防止）
            </div>
          </div>

          <button type="submit" id="submitBtn"
            class="btn-gold w-full py-4 rounded-xl text-base tracking-wide">
            出品を開始する
          </button>
        </form>
      </div>

      <!-- プレビュー（右1列） -->
      <div class="lg:col-span-1">
        <div class="sticky top-20">
          <h3 class="text-xs font-medium text-white/30 uppercase tracking-widest mb-3">Preview</h3>
          <div class="bg-dark-700 rounded-xl border border-white/5 overflow-hidden">
            <div id="previewImage" class="bg-gradient-to-br from-dark-600 to-dark-800 h-48 flex items-center justify-center relative">
              <div class="text-center">
                <svg class="w-12 h-12 mx-auto mb-2 text-gold/30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <div class="text-white/30 text-xs" id="previewProducer">生産者名</div>
              </div>
            </div>
            <div class="p-4">
              <p class="text-xs text-gold/60 mb-1 tracking-wide" id="previewProducerSmall">生産者</p>
              <p class="font-medium text-white/90 text-sm leading-snug mb-3" id="previewTitle">タイトル</p>
              <div class="flex flex-wrap gap-1.5 mb-3" id="previewTags"></div>
              <div class="flex items-end justify-between border-t border-white/5 pt-3">
                <div>
                  <p class="text-xs text-white/30">開始価格</p>
                  <p class="text-lg font-serif font-bold text-gold" id="previewPrice">¥—</p>
                </div>
                <p class="text-xs text-white/30">入札 0件</p>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- フッター -->
  <footer class="border-t border-white/5 mt-16 py-8">
    <div class="max-w-5xl mx-auto px-4 text-center">
      <p class="font-serif text-gold/40 text-sm tracking-widest">WINE BANK</p>
      <p class="text-white/20 text-xs mt-1">&copy; 2024 Wine Bank. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const token = localStorage.getItem('token');
    if (!token) { location.href = '/login'; }

    const wineEmojis = { red: '🍷', white: '🥂', sparkling: '🍾', rose: '🌸' };
    const wineGradients = {
      red: 'from-[#3a0a0a] to-[#1a0505]',
      white: 'from-[#3a3510] to-[#1a1a08]',
      sparkling: 'from-[#3a3010] to-[#1a1808]',
      rose: 'from-[#3a1020] to-[#1a0810]'
    };

    function updatePreview() {
      const title = document.getElementById('title').value || 'タイトル';
      const producer = document.getElementById('producer').value || '生産者';
      const vintage = document.getElementById('vintage').value;
      const price = parseInt(document.getElementById('starting_price').value);
      const wineType = document.querySelector('input[name="wine_type"]:checked').value;

      document.getElementById('previewTitle').textContent = title;
      document.getElementById('previewProducer').textContent = producer;
      document.getElementById('previewProducerSmall').textContent = producer;
      document.getElementById('previewPrice').textContent = price ? '¥' + price.toLocaleString() : '¥—';

      const tags = [];
      if (vintage) tags.push(`<span class="bg-gold/10 text-gold/80 text-xs px-2.5 py-0.5 rounded-full border border-gold/20">${vintage}</span>`);
      document.getElementById('previewTags').innerHTML = tags.join('');
    }

    document.querySelectorAll('input[name="wine_type"]').forEach(r => r.addEventListener('change', updatePreview));

    // ---- 複数画像アップロード処理 ----
    const slotImages = {};
    let currentSlot = null;

    function triggerSlot(index) {
      currentSlot = index;
      const input = document.getElementById('slotFileInput');
      input.value = '';
      input.onchange = (e) => {
        if (e.target.files[0]) uploadToSlot(index, e.target.files[0]);
      };
      input.click();
    }

    async function uploadToSlot(index, file) {
      const slotEl = document.querySelector(`.image-slot[data-slot="${index}"]`);
      const label = slotEl.dataset.label;
      slotEl.querySelector('.slot-placeholder').classList.add('hidden');
      slotEl.querySelector('.slot-preview').classList.add('hidden');
      slotEl.querySelector('.slot-loading').classList.remove('hidden');

      const formData = new FormData();
      formData.append('image', file);

      try {
        const res = await fetch('/api/upload/image', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` },
          body: formData
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        slotImages[index] = { url: data.url, label };
        slotEl.querySelector('.slot-img').src = data.url;
        slotEl.querySelector('.slot-loading').classList.add('hidden');
        slotEl.querySelector('.slot-preview').classList.remove('hidden');

        if (index === 0) {
          document.getElementById('previewImage').innerHTML =
            `<img src="${data.url}" alt="" class="w-full h-48 object-cover">`;
        }
      } catch (err) {
        slotEl.querySelector('.slot-loading').classList.add('hidden');
        slotEl.querySelector('.slot-placeholder').classList.remove('hidden');
        alert('アップロードエラー: ' + err.message);
      }
    }

    function removeSlot(e, index) {
      e.stopPropagation();
      delete slotImages[index];
      const slotEl = document.querySelector(`.image-slot[data-slot="${index}"]`);
      slotEl.querySelector('.slot-preview').classList.add('hidden');
      slotEl.querySelector('.slot-placeholder').classList.remove('hidden');
      if (index === 0) updatePreview();
    }

    // ---- フォーム送信 ----
    async function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.textContent = '出品中...';
      btn.disabled = true;

      const wineType = document.querySelector('input[name="wine_type"]:checked').value;
      const imageList = Object.entries(slotImages)
        .sort(([a],[b]) => a - b)
        .map(([idx, img]) => ({ url: img.url, label: img.label, sort_order: parseInt(idx) }));

      const payload = {
        title:          document.getElementById('title').value,
        producer:       document.getElementById('producer').value,
        vintage:        document.getElementById('vintage').value || null,
        region:         document.getElementById('region').value || null,
        appellation:    document.getElementById('appellation').value || null,
        grape:          document.getElementById('grape').value || null,
        volume_ml:      document.getElementById('volume_ml').value,
        condition_note: document.getElementById('condition_note').value.trim() || null,
        description:    document.getElementById('description').value || null,
        score_rp:       document.getElementById('score_rp').value || null,
        score_ws:       document.getElementById('score_ws').value || null,
        starting_price: document.getElementById('starting_price').value,
        end_hours:      document.getElementById('end_hours').value,
        wine_type:      wineType,
        image_emoji:    wineEmojis[wineType],
        image_color:    wineGradients[wineType],
        image_url:      imageList.length > 0 ? imageList[0].url : null
      };

      try {
        const res = await fetch('/api/auctions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'サーバーエラーが発生しました');

        if (imageList.length > 0) {
          await fetch(`/api/upload/auction-images/${data.id}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
            body: JSON.stringify({ images: imageList })
          });
        }
        location.href = `/detail?id=${data.id}`;
      } catch (err) {
        const box = document.getElementById('errorBox');
        box.textContent = err.message;
        box.classList.remove('hidden');
        btn.textContent = '出品を開始する';
        btn.disabled = false;
        window.scrollTo(0, 0);
      }
    }
  </script>
</body>
