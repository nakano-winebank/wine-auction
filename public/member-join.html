<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ワインを購入して会員になる — WineBank</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          gold: { DEFAULT: '#A78450', hover: '#8B6914' },
          dark: { 900: '#0A0A0A', 800: '#141414', 700: '#1C1C1C', 600: '#252525' }
        },
        fontFamily: { serif: ['Noto Serif JP','serif'], sans: ['Inter','Noto Sans JP','sans-serif'] }
      } }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
    /* Tailwind CDN が読めなかった場合でも表示が崩れないようにする */
    .hidden { display: none !important; }
    .plan-card { transition: border-color .2s, transform .2s; }
    .plan-card:hover { transform: translateY(-2px); }
    .plan-selected { border-color: #A78450 !important; box-shadow: 0 0 0 1px #A78450 inset; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:translateY(0) } }
    .fade-in { animation: fadeIn .3s ease; }
  </style>
</head>
<body class="bg-dark-900 text-white/90">

  <header class="bg-dark-800/95 backdrop-blur border-b border-white/5 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4">
      <div class="flex items-center h-14 gap-3">
        <a href="/member" class="text-white/40 hover:text-gold p-1 transition" aria-label="戻る">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <a href="/" class="font-serif text-gold tracking-wide">WineBank</a>
        <span class="font-medium text-white/90 ml-1 text-sm">ワインを購入する</span>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">

    <div id="loading" class="text-center py-20 text-white/40 text-sm">読み込み中…</div>

    <!-- 未ログイン -->
    <div id="needLogin" class="hidden text-center py-20">
      <p class="text-white/60">ワインのご購入にはログインが必要です。</p>
      <a href="/login" class="inline-block mt-4 px-5 py-2 bg-gold hover:bg-gold-hover text-dark-900 rounded text-sm font-semibold transition">ログイン</a>
    </div>

    <div id="content" class="hidden fade-in">
      <section class="mb-8">
        <h1 class="font-serif text-2xl text-white/90 mb-2">ご購入プラン</h1>
        <p class="text-sm text-white/50 leading-relaxed">
          ご購入いただいたワインは WineBank が保管し、会員口座に資産として記録されます。<br>
          ご購入額に応じて会員ランクが決まり、ランクごとの還元率でワインマイルが貯まります。
        </p>
      </section>

      <div id="plans" class="grid gap-4 md:grid-cols-3 mb-8"></div>

      <!-- 購入確認 -->
      <section id="confirm" class="hidden bg-dark-800 border border-gold/25 rounded-lg p-5 mb-8">
        <h2 class="font-serif text-lg text-gold mb-4">ご購入内容の確認</h2>
        <dl class="text-sm space-y-2 mb-5" id="confirmDetail"></dl>
        <div class="flex gap-3 flex-wrap">
          <button id="submitBtn" class="px-6 py-2.5 bg-gold hover:bg-gold-hover text-dark-900 rounded text-sm font-semibold transition">
            このプランで購入する
          </button>
          <button id="cancelBtn" class="px-4 py-2.5 border border-white/15 hover:border-white/30 text-white/60 rounded text-sm transition">
            選び直す
          </button>
        </div>
        <p class="text-xs text-white/30 mt-4">
          ※ 決済は未接続です。検証用に、購入が成立したものとして会員口座と保有ワインを登録します。
        </p>
      </section>

      <div id="error" class="hidden bg-red-500/10 border border-red-500/30 rounded p-3 text-sm text-red-300 mb-6"></div>

      <!-- 購入完了 -->
      <section id="done" class="hidden bg-dark-800 border border-emerald-500/25 rounded-lg p-6 text-center">
        <div class="font-serif text-xl text-emerald-400 mb-2">ご購入ありがとうございます</div>
        <div class="text-sm text-white/70 mb-5" id="doneDetail"></div>
        <a href="/member" class="inline-block px-6 py-2.5 bg-gold hover:bg-gold-hover text-dark-900 rounded text-sm font-semibold transition">
          マイ・セラーで確認する
        </a>
      </section>
    </div>
  </main>

<script>
const yen = (n) => n === null || n === undefined ? '—' : '¥' + Math.round(n).toLocaleString();
const num = (n) => n === null || n === undefined ? '—' : Math.round(n).toLocaleString();
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => (
  { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const token = localStorage.getItem('token');
const auth = { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' };

let plans = [];
let selected = null;

function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }

function showError(message) {
  const el = document.getElementById('error');
  el.textContent = message;
  el.classList.remove('hidden');
}

async function load() {
  if (!token) { hide('loading'); show('needLogin'); return; }

  const res = await fetch('/api/member/shop/plans', { headers: auth });
  if (!res.ok) {
    hide('loading'); show('content');
    showError((await res.json().catch(() => ({}))).error || 'プランの読み込みに失敗しました。');
    return;
  }
  plans = (await res.json()).plans;
  renderPlans();
  hide('loading'); show('content');
}

function renderPlans() {
  document.getElementById('plans').innerHTML = plans.map(p => `
    <button data-plan="${esc(p.rankCode)}"
            class="plan-card text-left bg-dark-800 border border-white/10 hover:border-gold/50 rounded-lg p-5">
      <div class="font-serif text-xl text-gold mb-1">${esc(p.rankName)}</div>
      <div class="text-2xl font-semibold mb-4">${yen(p.bookValue)}</div>

      <div class="text-sm text-white/80 mb-1">${esc(p.wine.wineName)}${p.wine.vintage ? ' ' + p.wine.vintage : ''}</div>
      <div class="text-xs text-white/35 mb-3">${esc(p.wine.region)} ／ ${num(p.quantity)}本（${yen(p.unitPrice)}／本）</div>
      <p class="text-xs text-white/45 leading-relaxed mb-4">${esc(p.wine.tagline)}</p>

      <dl class="text-xs space-y-1 border-t border-white/10 pt-3">
        <div class="flex justify-between"><dt class="text-white/40">マイル還元率</dt><dd class="text-gold font-semibold">${(p.mileRate * 100).toFixed(1)}%</dd></div>
        <div class="flex justify-between"><dt class="text-white/40">初年度マイル</dt><dd>${num(p.firstYearMiles)}</dd></div>
        <div class="flex justify-between"><dt class="text-white/40">入会記念ボーナス</dt><dd>${num(p.welcomeBonusMiles)}</dd></div>
        <div class="flex justify-between"><dt class="text-white/40">年間管理手数料</dt><dd class="text-white/60">${yen(p.annualFee)}（${(p.feeRate * 100).toFixed(1)}%）</dd></div>
      </dl>
    </button>`).join('');

  document.querySelectorAll('[data-plan]').forEach(btn => {
    btn.addEventListener('click', () => selectPlan(btn.dataset.plan));
  });
}

function selectPlan(rankCode) {
  selected = plans.find(p => p.rankCode === rankCode);
  if (!selected) return;

  document.querySelectorAll('[data-plan]').forEach(b => {
    b.classList.toggle('plan-selected', b.dataset.plan === rankCode);
  });

  document.getElementById('confirmDetail').innerHTML = `
    <div class="flex justify-between border-b border-white/5 pb-2"><dt class="text-white/40">プラン</dt><dd>${esc(selected.rankName)}</dd></div>
    <div class="flex justify-between border-b border-white/5 pb-2"><dt class="text-white/40">銘柄</dt><dd>${esc(selected.wine.wineName)}${selected.wine.vintage ? ' ' + selected.wine.vintage : ''}</dd></div>
    <div class="flex justify-between border-b border-white/5 pb-2"><dt class="text-white/40">本数</dt><dd>${num(selected.quantity)} 本</dd></div>
    <div class="flex justify-between border-b border-white/5 pb-2"><dt class="text-white/40">ご購入金額</dt><dd class="text-lg font-semibold">${yen(selected.bookValue)}</dd></div>
    <div class="flex justify-between"><dt class="text-white/40">付与予定マイル</dt><dd class="text-gold">${num(selected.firstYearMiles + selected.welcomeBonusMiles)}</dd></div>`;

  show('confirm');
  document.getElementById('confirm').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

document.getElementById('cancelBtn').addEventListener('click', () => {
  selected = null;
  hide('confirm');
  document.querySelectorAll('[data-plan]').forEach(b => b.classList.remove('plan-selected'));
});

document.getElementById('submitBtn').addEventListener('click', async () => {
  if (!selected) return;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '処理中…';
  hide('error');

  const res = await fetch('/api/member/shop/purchase', {
    method: 'POST', headers: auth,
    body: JSON.stringify({ rankCode: selected.rankCode }),
  });
  const body = await res.json().catch(() => ({}));

  if (!res.ok) {
    btn.disabled = false;
    btn.textContent = 'このプランで購入する';
    showError(body.error || '購入処理に失敗しました。');
    return;
  }

  const granted = (body.grants || []).reduce((sum, g) => sum + g.amount, 0);
  document.getElementById('doneDetail').innerHTML = `
    会員番号 <span class="font-mono text-gold">${esc(body.accountNo)}</span> で会員口座を開設しました。<br>
    会員ランクは <span class="text-gold font-semibold">${esc(body.rankCode || '—')}</span>、
    ワインマイルを <span class="text-gold font-semibold">${num(granted)}</span> 付与しました。`;
  hide('confirm');
  document.getElementById('plans').classList.add('hidden');
  show('done');
});

load();
</script>
</body>
</html>
