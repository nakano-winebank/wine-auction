<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ — WineBank</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: { DEFAULT: '#A78450', hover: '#8B6914' },
            dark: { 900: '#0A0A0A', 800: '#141414', 700: '#1C1C1C', 600: '#252525' }
          },
          fontFamily: {
            serif: ['Noto Serif JP', 'serif'],
            sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
    .tab-active { border-bottom: 2px solid #A78450; color: #A78450; font-weight: 700; }
    .tab-inactive { border-bottom: 2px solid transparent; color: rgba(255,255,255,0.4); }
    .tab-inactive:hover { color: rgba(255,255,255,0.7); }
    .winning-row { background: rgba(167,132,80,0.08); border-color: rgba(167,132,80,0.2) !important; }
    .losing-row { background: rgba(220,38,38,0.06); border-color: rgba(220,38,38,0.15) !important; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease; }
    .skeleton { background: linear-gradient(90deg,#1C1C1C 25%,#252525 50%,#1C1C1C 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
</head>
<body class="bg-dark-900">

  <!-- ヘッダー -->
  <header class="bg-dark-800/95 backdrop-blur border-b border-white/5 sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4">
      <div class="flex items-center h-14 gap-3">
        <a href="/" class="text-white/40 hover:text-gold p-1 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <a href="/" class="flex items-center gap-2">
          <span class="text-gold"><svg class="h-5" viewBox="0 0 176.426 30.418" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M20.687 9.871l8.482 20.55 3.669-8.887L24.355.984z"/><path d="M40.909 1.975l-.069.168c.26-.631.581-1.159 1.295-1.159h1.263V0H32.039v.984h1.12c.714 0 1.035.528 1.3 1.159l.008.02.007.017.011.027 3.165 7.666z"/><path d="M9.691 1.982l-.011-.026.011.026c-.311-.753-.136-1 .7-1h.963V0H0v.984h1.123c.714 0 1.035.528 1.3 1.159l-.152-.368L14.09 30.416l3.669-8.887-8.044-19.49-.023-.057"/><path d="M38.609 15.697h2.29v13.7h-2.29v.916h8.98v-.916h-2.29v-13.7h2.29v-.916h-8.98z"/><path d="M60.602 15.697a10.273 10.273 0 011.551.034c.563.036.563.317.6 1.057v7.009l-7.643-9.016h-6.13v.916a12.094 12.094 0 011.727.034c.527.036.527.247.563 1.093v11.3c-.036 1.021-.14 1.233-.881 1.233H48.98v.951h5.917v-.951h-1.584c-.81-.034-.846-.352-.881-1.233V17.879l10.46 12.539h1.021v-13.63c.036-.669.071-.986.494-1.057.1-.034 1.62-.034 1.831-.034v-.916h-5.636z"/><path d="M76.663 29.397h-2.432v-6.515c2.572 0 3.311.21 3.558 2.887h.917v-6.412h-.917c-.176 2.36-.917 2.571-3.558 2.571v-6.231h3.45c2.183.106 3.1.352 3.943 3.2h.881l-.352-4.12H67.54v.916h2.29v13.7h-2.29v.916h15.215l.387-5.071h-.881c-1.09 4.085-3.168 4.12-5.6 4.155"/><path d="M128.892 14.322h-1.057l-5.669 13.594c-.53 1.093-.634 1.2-.846 1.338-.247.141-.283.141-2.078.141v.916h6.128v-.916c-2.078 0-2.43 0-2.43-.6a1.414 1.414 0 01.1-.493l1.022-2.571 2.677-6.445 2.4 6.445 1.373 3.662h-2.183v.916h8.522v-.916h-1.936z"/><path d="M149.37 15.697a10.271 10.271 0 011.551.034c.563.036.563.317.6 1.057v7.009l-7.643-9.016h-6.128v.916a12.1 12.1 0 011.727.034c.527.036.527.247.563 1.093v11.3c-.036 1.021-.14 1.233-.881 1.233h-1.409v.951h5.917v-.951h-1.584c-.81-.034-.846-.352-.881-1.233V17.879l10.461 12.539h1.021v-13.63c.036-.669.071-.986.494-1.057.1-.034 1.62-.034 1.831-.034v-.916h-5.636z"/><path d="M162.927 15.697h2.115v-.916h-8.733v.916h2.29v13.7h-2.29v.916h8.733v-.916h-2.111z"/><path d="M171.597 26.427c-1.322-1.374-4.939-5.941-4.939-5.941l3.242-3.417a4.648 4.648 0 011.831-1.3 7.609 7.609 0 011.8-.07v-.915h-6.622v.915h1.9c.1 0 .351.034.351.246a1.236 1.236 0 01-.316.6l-5.636 5.988s3.487 4.883 5.5 6.415c2.855 2.174 5.784 1.6 7.719-.549-2.064.551-3.461-.548-4.828-1.968"/><path d="M112.157 14.491c3.782-.634 5.674-3.911 5.674-7.19 0-3.651-2.345-7.3-7.034-7.3H94.602v1.087h2.8c.011.111.017.226.017.348v27.609a3.041 3.041 0 01-.023.364h-2.8v1.009h17.362c5.044 0 7.566-3.954 7.566-7.908 0-3.9-2.459-7.916-7.373-8.019m-.276-7.19c0 3.651-3.183 6.541-7.872 6.541h-.584V1.437c0-.122.006-.238.017-.348h1.405c4.689 0 7.034 2.562 7.034 6.213m-7.034 22.108h-1.4a3.309 3.309 0 01-.024-.428v.428-14.558h1.893c5.044 0 8.262 3.705 8.262 7.659s-3.689 6.9-8.733 6.9"/></svg></span>
        </a>
        <span class="font-medium text-white/90 ml-1 text-sm">マイページ</span>
        <div class="ml-auto flex items-center gap-3">
          <a href="/sell" class="bg-gold text-dark-900 text-sm px-4 py-1.5 rounded-full hover:bg-gold-hover font-medium transition">出品する</a>
          <button onclick="logout()" class="text-sm text-white/40 hover:text-white/70 transition">ログアウト</button>
        </div>
      </div>
    </div>
  </header>

  <div class="max-w-4xl mx-auto px-4 py-6" id="mainContent">
    <!-- ローディング -->
    <div class="text-center py-16" id="loadingState">
      <div class="text-4xl mb-3 animate-pulse">🍷</div>
      <p class="text-white/40">読み込み中...</p>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const currentUser = JSON.parse(localStorage.getItem('user') || 'null');
    if (!token) { location.href = '/login'; }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      location.href = '/';
    }

    async function loadMyPage() {
      try {
        const res = await fetch('/api/mypage', { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) throw new Error();
        const data = await res.json();
        renderPage(data);
      } catch(e) {
        document.getElementById('loadingState').innerHTML = '<p class="text-white/40 py-20 text-center">データの取得に失敗しました</p>';
      }
    }

    function renderPage({ user, bidding, selling, watchlist }) {
      document.getElementById('loadingState').classList.add('hidden');

      const activeWin = bidding.filter(a => a.status === 'active' && a.is_top_bidder).length;
      const activeLose = bidding.filter(a => a.status === 'active' && !a.is_top_bidder).length;

      document.getElementById('mainContent').innerHTML = `
        <!-- プロフィールカード -->
        <div class="bg-dark-700 rounded-2xl border border-white/5 p-5 mb-6 fade-in">
          <div class="flex items-center gap-4">
            <div class="w-16 h-16 rounded-full bg-gold/10 flex items-center justify-center text-gold text-2xl font-bold flex-shrink-0 font-serif">
              ${(user.display_name || user.username)[0].toUpperCase()}
            </div>
            <div class="flex-1">
              <div class="flex items-center gap-2 flex-wrap">
                <h1 class="font-bold text-white/90 text-lg">${user.display_name || user.username}</h1>
                ${user.is_verified_seller ? '<span class="border border-gold/30 text-gold bg-gold/10 text-xs px-2 py-0.5 rounded">認定セラー</span>' : ''}
              </div>
              <p class="text-sm text-white/40">@${user.username}</p>
              <div class="flex gap-4 mt-2 text-sm">
                <span class="text-white/60">⭐ ${user.rating.toFixed(1)}</span>
                <span class="text-white/60">取引 ${user.trade_count}件</span>
                <span class="text-white/60">登録 ${new Date(user.created_at).toLocaleDateString('ja-JP')}</span>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-3 text-center flex-shrink-0 hidden sm:grid">
              <div class="bg-gold/10 rounded-xl p-3">
                <p class="text-2xl font-bold text-gold">${activeWin}</p>
                <p class="text-xs text-gold/70 mt-1">最高入札中</p>
              </div>
              <div class="bg-red-500/10 rounded-xl p-3">
                <p class="text-2xl font-bold text-red-400">${activeLose}</p>
                <p class="text-xs text-red-400/70 mt-1">抜かれ中</p>
              </div>
              <div class="bg-white/5 rounded-xl p-3">
                <p class="text-2xl font-bold text-white/90">${watchlist.length}</p>
                <p class="text-xs text-white/40 mt-1">ウォッチ中</p>
              </div>
            </div>
          </div>
        </div>

        <!-- タブ -->
        <div class="flex border-b border-white/10 mb-4 overflow-x-auto">
          <button onclick="switchTab('bidding')" id="tab-bidding"
            class="tab-active px-4 py-3 text-sm transition whitespace-nowrap">
            入札中 <span class="ml-1 bg-gold/20 text-gold text-xs px-1.5 py-0.5 rounded-full">${bidding.filter(a=>a.status==='active').length}</span>
          </button>
          <button onclick="switchTab('selling')" id="tab-selling"
            class="tab-inactive px-4 py-3 text-sm transition whitespace-nowrap">
            出品中 <span class="ml-1 bg-white/5 text-white/40 text-xs px-1.5 py-0.5 rounded-full">${selling.filter(a=>a.status==='active').length}</span>
          </button>
          <button onclick="switchTab('watchlist')" id="tab-watchlist"
            class="tab-inactive px-4 py-3 text-sm transition whitespace-nowrap">
            ウォッチ <span class="ml-1 bg-white/5 text-white/40 text-xs px-1.5 py-0.5 rounded-full">${watchlist.length}</span>
          </button>
          <button onclick="switchTab('orders')" id="tab-orders"
            class="tab-inactive px-4 py-3 text-sm transition whitespace-nowrap">
            注文 <span class="ml-1 bg-white/5 text-white/40 text-xs px-1.5 py-0.5 rounded-full" id="ordersCount"></span>
          </button>
          <button onclick="switchTab('ended')" id="tab-ended"
            class="tab-inactive px-4 py-3 text-sm transition whitespace-nowrap">終了済み</button>
          <button onclick="switchTab('messages')" id="tab-messages"
            class="tab-inactive px-4 py-3 text-sm transition whitespace-nowrap">メッセージ</button>
          <button onclick="switchTab('profile')" id="tab-profile"
            class="tab-inactive px-4 py-3 text-sm transition whitespace-nowrap">プロフィール</button>
        </div>

        <!-- コンテンツ -->
        <div id="tab-content-bidding" class="tab-content fade-in">
          ${renderAuctionList(bidding.filter(a=>a.status==='active'), 'bidding')}
        </div>
        <div id="tab-content-selling" class="tab-content hidden">
          ${renderAuctionList(selling.filter(a=>a.status==='active'), 'selling')}
        </div>
        <div id="tab-content-watchlist" class="tab-content hidden">
          ${renderAuctionList(watchlist.filter(a=>a.status==='active'), 'watchlist')}
        </div>
        <div id="tab-content-orders" class="tab-content hidden fade-in">
          <div id="ordersContent"><div class="text-center py-12 text-white/40">読み込み中...</div></div>
        </div>
        <div id="tab-content-ended" class="tab-content hidden">
          ${renderAuctionList([...bidding, ...selling].filter(a=>a.status!=='active'), 'ended')}
        </div>
        <div id="tab-content-messages" class="tab-content hidden fade-in">
          <div id="messagesContent"><div class="text-center py-12 text-white/40">読み込み中...</div></div>
        </div>
        <div id="tab-content-profile" class="tab-content hidden fade-in">
          ${renderProfileTab(user)}
        </div>
      `;
    }

    function renderAuctionList(auctions, type) {
      if (!auctions.length) {
        const msgs = {
          bidding: '入札中のオークションはありません',
          selling: '出品中のアイテムはありません',
          watchlist: 'ウォッチ中のオークションはありません',
          ended: '終了済みのオークションはありません'
        };
        return `<div class="text-center py-12 text-white/40">
          <div class="text-4xl mb-3">🍷</div>
          <p class="text-sm">${msgs[type]}</p>
          ${type === 'selling' ? '<a href="/sell" class="mt-3 inline-block text-sm text-gold font-medium underline">出品してみる →</a>' : ''}
          ${type === 'watchlist' ? '<a href="/" class="mt-3 inline-block text-sm text-gold font-medium underline">オークションを見る →</a>' : ''}
        </div>`;
      }

      return auctions.map(a => {
        const isActive = a.status === 'active';
        const diffMs = new Date(a.end_time) - new Date();
        const isWinning = type === 'bidding' && a.is_top_bidder;
        const isLosing = type === 'bidding' && !a.is_top_bidder;

        let statusBadge = '';
        if (type === 'bidding') {
          statusBadge = isWinning
            ? '<span class="bg-gold/15 text-gold text-xs px-2 py-0.5 rounded-full font-medium">✓ 最高入札中</span>'
            : '<span class="bg-red-500/15 text-red-400 text-xs px-2 py-0.5 rounded-full font-medium">⚠ 抜かれています</span>';
        } else if (type === 'selling') {
          statusBadge = `<span class="bg-white/5 text-white/60 text-xs px-2 py-0.5 rounded-full">入札 ${a.bid_count}件</span>`;
        } else if (!isActive) {
          statusBadge = '<span class="bg-white/5 text-white/40 text-xs px-2 py-0.5 rounded-full">終了</span>';
        }

        const rowClass = isWinning ? 'winning-row' : isLosing ? 'losing-row' : '';

        return `
          <a href="/detail?id=${a.id}" class="flex items-center gap-4 p-4 bg-dark-700 rounded-xl border border-white/5 hover:border-gold/30 transition mb-3 ${rowClass}">
            <div class="bg-gradient-to-br ${a.image_color} w-16 h-16 rounded-xl flex items-center justify-center text-2xl flex-shrink-0">
              ${a.image_emoji}
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap mb-1">
                ${statusBadge}
                ${isActive && diffMs < 3600000 ? `<span class="text-red-400 text-xs font-medium">残り ${formatTime(diffMs)}</span>` : ''}
              </div>
              <p class="font-medium text-white/90 text-sm truncate">${a.title}</p>
              <p class="text-xs text-white/40 mt-0.5">${a.producer}${a.vintage ? ' ' + a.vintage : ''}</p>
            </div>
            <div class="text-right flex-shrink-0">
              <p class="font-bold text-white/90">¥${a.current_price.toLocaleString()}</p>
              ${type === 'bidding' ? `<p class="text-xs text-white/40 mt-0.5">自分: ¥${(a.my_highest_bid||0).toLocaleString()}</p>` : ''}
              ${type === 'selling' ? `<p class="text-xs text-white/40 mt-0.5">入札者 ${a.bidder_count}人</p>` : ''}
              <p class="text-xs text-white/30">${isActive ? formatEndDate(a.end_time) : '終了済み'}</p>
            </div>
          </a>`;
      }).join('');
    }

    function switchTab(name) {
      ['bidding', 'selling', 'watchlist', 'orders', 'ended', 'messages', 'profile'].forEach(t => {
        const tabBtn = document.getElementById(`tab-${t}`);
        if (tabBtn) tabBtn.className = t === name
          ? 'tab-active px-4 py-3 text-sm transition whitespace-nowrap'
          : 'tab-inactive px-4 py-3 text-sm transition whitespace-nowrap';
        const content = document.getElementById(`tab-content-${t}`);
        if (content) content.classList.toggle('hidden', t !== name);
      });
      if (name === 'orders') loadOrders();
      if (name === 'messages') loadMessages();
    }

    function renderProfileTab(user) {
      const licenseStatus = user.license_verified
        ? '<span class="bg-green-500/15 text-green-400 text-xs px-2 py-0.5 rounded-full font-medium">✓ 確認済み</span>'
        : user.license_image_url
          ? '<span class="bg-yellow-500/15 text-yellow-400 text-xs px-2 py-0.5 rounded-full font-medium">⏳ 審査中</span>'
          : '<span class="bg-white/5 text-white/40 text-xs px-2 py-0.5 rounded-full">未提出</span>';

      return `
        <!-- メール認証バナー -->
        ${!user.email_verified ? `
        <div class="bg-yellow-500/10 border border-yellow-500/20 rounded-xl p-4 mb-4 flex items-start gap-3">
          <div class="text-yellow-400 text-xl flex-shrink-0">⚠️</div>
          <div>
            <p class="text-sm font-medium text-yellow-300">メールアドレスが未確認です</p>
            <p class="text-xs text-yellow-400/70 mt-0.5">${user.email} 宛に確認メールを送信済みです。メールボックスをご確認ください。</p>
            <button onclick="resendVerification()" class="mt-2 text-xs text-yellow-300 underline hover:text-yellow-200">確認メールを再送する</button>
          </div>
        </div>` : ''}

        <!-- 基本情報 -->
        <div class="bg-dark-700 rounded-2xl border border-white/5 p-5 mb-4">
          <h3 class="font-bold text-white/90 mb-4">👤 基本情報</h3>
          <div class="space-y-3">
            <div>
              <label class="block text-xs font-medium text-white/40 mb-1">メールアドレス</label>
              <div class="flex items-center gap-2">
                <input type="text" value="${user.email}" readonly
                  class="flex-1 border border-white/10 rounded-lg px-3 py-2 text-sm bg-dark-600 text-white/40 cursor-not-allowed">
                ${user.email_verified
                  ? '<span class="text-xs bg-green-500/15 text-green-400 px-2 py-1 rounded whitespace-nowrap">✓ 確認済</span>'
                  : '<span class="text-xs bg-yellow-500/15 text-yellow-400 px-2 py-1 rounded whitespace-nowrap">未確認</span>'}
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-white/60 mb-1">姓</label>
                <input type="text" id="profileLastName" placeholder="山田"
                  value="${user.full_name ? user.full_name.split(' ')[0] : ''}"
                  class="w-full border border-white/10 rounded-lg px-3 py-2 text-sm bg-dark-600 text-white/90 placeholder-white/20 focus:outline-none focus:border-gold">
              </div>
              <div>
                <label class="block text-xs font-medium text-white/60 mb-1">名</label>
                <input type="text" id="profileFirstName" placeholder="太郎"
                  value="${user.full_name ? user.full_name.split(' ').slice(1).join(' ') : ''}"
                  class="w-full border border-white/10 rounded-lg px-3 py-2 text-sm bg-dark-600 text-white/90 placeholder-white/20 focus:outline-none focus:border-gold">
              </div>
            </div>
            <div>
              <label class="block text-xs font-medium text-white/60 mb-1">携帯電話番号</label>
              <input type="tel" id="profilePhone" placeholder="090-1234-5678"
                value="${user.phone || ''}"
                class="w-full border border-white/10 rounded-lg px-3 py-2 text-sm bg-dark-600 text-white/90 placeholder-white/20 focus:outline-none focus:border-gold">
            </div>
            <div>
              <label class="block text-xs font-medium text-white/60 mb-1">表示名</label>
              <input type="text" id="profileDisplayName" placeholder="WineCollector_Tokyo"
                value="${user.display_name || ''}"
                class="w-full border border-white/10 rounded-lg px-3 py-2 text-sm bg-dark-600 text-white/90 placeholder-white/20 focus:outline-none focus:border-gold">
            </div>
          </div>
          <button onclick="saveProfile()" id="saveProfileBtn"
            class="mt-4 bg-gold text-dark-900 px-5 py-2 rounded-lg text-sm font-medium hover:bg-gold-hover transition">
            保存する
          </button>
          <p id="profileMsg" class="text-sm mt-2 hidden"></p>
        </div>

        <!-- 住所 -->
        <div class="bg-dark-700 rounded-2xl border border-white/5 p-5 mb-4">
          <h3 class="font-bold text-white/90 mb-4">📦 配送先住所</h3>
          <div class="space-y-3">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-white/60 mb-1">郵便番号</label>
                <input type="text" id="addrZip" placeholder="123-4567" value="${user.address_zip || ''}"
                  class="w-full border border-white/10 rounded-lg px-3 py-2 text-sm bg-dark-600 text-white/90 placeholder-white/20 focus:outline-none focus:border-gold">
              </div>
              <div>
                <label class="block text-xs font-medium text-white/60 mb-1">都道府県</label>
                <input type="text" id="addrPref" placeholder="東京都" value="${user.address_pref || ''}"
                  class="w-full border border-white/10 rounded-lg px-3 py-2 text-sm bg-dark-600 text-white/90 placeholder-white/20 focus:outline-none focus:border-gold">
              </div>
            </div>
            <div>
              <label class="block text-xs font-medium text-white/60 mb-1">市区町村</label>

    async function toggleOrderMessages(orderId, card) {
      const panel = document.getElementById(`msg-panel-${orderId}`);
      const arrow = card.querySelector('svg');
      const isOpen = !panel.classList.contains('hidden');
      if (isOpen) {
        panel.classList.add('hidden');
        arrow.style.transform = '';
        return;
      }
      panel.classList.remove('hidden');
      arrow.style.transform = 'rotate(180deg)';
      await fetchMessages(orderId);
    }

    async function fetchMessages(orderId) {
      const list = document.getElementById(`msg-list-${orderId}`);
      try {
        const res = await fetch(`/api/mypage/messages/${orderId}`, {
          headers: { Authorization: 'Bearer ' + token }
        });
        const { messages } = await res.json();
        if (!messages.length) {
          list.innerHTML = '<div class="text-center py-4 text-white/40 text-sm">メッセージはありません</div>';
          return;
        }
        list.innerHTML = messages.map(m => {
          const isMine = m.sender_id === (currentUser && currentUser.id);
          return `
            <div class="flex ${isMine ? 'justify-end' : 'justify-start'}">
              <div class="max-w-xs">
                <p class="text-xs text-white/30 mb-0.5 ${isMine ? 'text-right' : ''}">${m.sender_name || m.sender_username}</p>
                <div class="rounded-xl px-3 py-2 text-sm ${isMine ? 'bg-gold text-dark-900' : 'bg-dark-600 text-white/80'}">
                  ${m.content.replace(/</g, '&lt;').replace(/>/g, '&gt;')}
                </div>
                <p class="text-xs text-white/20 mt-0.5 ${isMine ? 'text-right' : ''}">${new Date(m.created_at).toLocaleString('ja-JP', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</p>
              </div>
            </div>`;
        }).join('');
        list.scrollTop = list.scrollHeight;
      } catch(e) {
        list.innerHTML = '<div class="text-center py-4 text-white/40 text-sm">読み込みに失敗しました</div>';
      }
    }

    async function sendMessage(orderId) {
      const input = document.getElementById(`msg-input-${orderId}`);
      const content = input.value.trim();
      if (!content) return;
      try {
        const res = await fetch(`/api/mypage/messages/${orderId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ content })
        });
        if (!res.ok) throw new Error();
        input.value = '';
        await fetchMessages(orderId);
      } catch(e) {
        alert('送信に失敗しました');
      }
    }

    async function uploadLicense(input) {
      const file = input.files[0];
      if (!file) return;
      const msg = document.getElementById('licenseMsg');

      const formData = new FormData();
      formData.append('image', file);

      try {
        msg.textContent = 'アップロード中...';
        msg.className = 'text-sm mt-2 text-white/40';
        msg.classList.remove('hidden');

        const res = await fetch('/api/upload/image', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token },
          body: formData
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        const res2 = await fetch('/api/mypage/license', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ url: data.url })
        });
        const data2 = await res2.json();
        if (!res2.ok) throw new Error(data2.error);

        msg.textContent = '✓ ' + data2.message;
        msg.className = 'text-sm mt-2 text-green-400';
        setTimeout(() => location.reload(), 1500);
      } catch(e) {
        msg.textContent = e.message;
        msg.className = 'text-sm mt-2 text-red-400';
      }
    }

    // ===== 注文管理 =====
    const fulfillmentSteps = [
      { key: 'paid', label: '支払済', icon: '💰' },
      { key: 'shipped', label: '発送済', icon: '📦' },
      { key: 'delivered', label: '受取済', icon: '✅' },
      { key: 'completed', label: '完了', icon: '🎉' }
    ];

    function getFulfillmentIndex(status) {
      const idx = fulfillmentSteps.findIndex(s => s.key === status);
      return idx >= 0 ? idx : -1;
    }

    function renderFulfillmentBar(status) {
      const currentIdx = getFulfillmentIndex(status);
      return `
        <div class="flex items-center gap-1 mt-3">
          ${fulfillmentSteps.map((step, i) => {
            const done = i <= currentIdx;
            const active = i === currentIdx;
            return `
              <div class="flex items-center ${i > 0 ? 'flex-1' : ''}">
                ${i > 0 ? `<div class="flex-1 h-0.5 ${done ? 'bg-gold' : 'bg-white/10'}"></div>` : ''}
                <div class="flex flex-col items-center">
                  <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs
                    ${done ? 'bg-gold/20 text-gold border border-gold/40' : 'bg-dark-600 text-white/30 border border-white/10'}
                    ${active ? 'ring-2 ring-gold/30' : ''}">
                    ${step.icon}
                  </div>
                  <span class="text-[10px] mt-1 ${done ? 'text-gold' : 'text-white/30'}">${step.label}</span>
                </div>
              </div>`;
          }).join('')}
        </div>`;
    }

    function renderFulfillmentBadge(status) {
      const map = {
        'pending_payment': { label: '支払待ち', cls: 'bg-yellow-500/15 text-yellow-400' },
        'paid': { label: '支払済', cls: 'bg-blue-500/15 text-blue-400' },
        'shipped': { label: '発送済', cls: 'bg-purple-500/15 text-purple-400' },
        'delivered': { label: '受取済', cls: 'bg-green-500/15 text-green-400' },
        'completed': { label: '取引完了', cls: 'bg-gold/15 text-gold' }
      };
      const s = map[status] || { label: status, cls: 'bg-white/5 text-white/40' };
      return `<span class="${s.cls} text-xs px-2 py-0.5 rounded-full font-medium">${s.label}</span>`;
    }

              <div class="flex items-start gap-3">
                <div class="bg-gradient-to-br ${o.image_color || 'from-purple-500 to-pink-500'} w-14 h-14 rounded-xl flex items-center justify-center text-xl flex-shrink-0">
                  ${o.image_emoji || '🍷'}
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 flex-wrap mb-1">
                    <span class="text-xs px-2 py-0.5 rounded-full font-medium ${isSeller ? 'bg-blue-500/15 text-blue-400' : 'bg-green-500/15 text-green-400'}">
                      ${isSeller ? '出品者' : '購入者'}
                    </span>
                    ${renderFulfillmentBadge(fs)}
                  </div>
                  <p class="font-medium text-white/90 text-sm truncate">${o.title}</p>
                  <p class="text-xs text-white/40 mt-0.5">${o.producer || ''} ／ ${isSeller ? '購入者: ' + (o.buyer_name || '—') : '出品者: ' + (o.seller_name || '—')}</p>
                </div>
                <div class="text-right flex-shrink-0">
                  <p class="font-bold text-white/90">¥${(o.amount || 0).toLocaleString()}</p>
                  <p class="text-xs text-white/30 mt-0.5">${o.paid_at ? new Date(o.paid_at).toLocaleDateString('ja-JP') : ''}</p>
                </div>
              </div>
              ${renderFulfillmentBar(fs)}
              ${actionBtn}
            </div>`;
        }).join('');
      } catch(e) {
        container.innerHTML = '<div class="text-center py-12 text-white/40">読み込みに失敗しました</div>';
      }
    }

    async function shipOrder(orderId) {
      const btn = document.getElementById(`shipBtn-${orderId}`);
      const trackingNumber = document.getElementById(`track-${orderId}`).value.trim();
      const carrier = document.getElementById(`carrier-${orderId}`).value;
      btn.disabled = true;
      btn.textContent = '処理中...';
      try {
        const res = await fetch(`/api/mypage/orders/${orderId}/ship`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ tracking_number: trackingNumber || null, carrier: carrier || null })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        await loadOrders();
      } catch(e) {
        alert(e.message || '発送処理に失敗しました');
        btn.disabled = false;
        btn.textContent = '発送完了にする';
      }
    }

    async function confirmDelivery(orderId) {
      if (!confirm('受け取りを確認しますか？この操作は取り消せません。')) return;
      const btn = document.getElementById(`confirmBtn-${orderId}`);
      btn.disabled = true;
      btn.textContent = '処理中...';
      try {
        const res = await fetch(`/api/mypage/orders/${orderId}/confirm`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        await loadOrders();
      } catch(e) {
        alert(e.message || '受取確認に失敗しました');
        btn.disabled = false;
        btn.textContent = '✅ 受け取りを確認する';
      }
    }

    function formatTime(ms) {
      const h = Math.floor(ms / 3600000);
      const m = Math.floor((ms % 3600000) / 60000);
      if (h > 0) return `${h}時間${m}分`;
      return `${m}分`;
    }

    function formatEndDate(dateStr) {
      const d = new Date(dateStr);
      const diff = d - new Date();
      if (diff < 24 * 3600000) return `残り ${formatTime(diff)}`;
      return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}終了`;
    }

    loadMyPage();
  </script>
</body>
</html>
