<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理画面 — ワインオークション</title>
  <link rel="stylesheet" href="/css/tailwind.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
    h1, h2, h3, .heading, .font-serif { font-family: 'Noto Serif JP', serif; }

    .tab-active { background: rgba(167,132,80,0.15); color: #A78450; border: 1px solid rgba(167,132,80,0.4); }
    .tab-inactive { background: #1C1C1C; color: #888; border: 1px solid #2F2F2F; }
    .tab-inactive:hover { background: #252525; color: #aaa; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
    .fade-in { animation: fadeIn 0.2s ease; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0A0A0A; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #A78450; }

    .gold-border { border-color: rgba(167,132,80,0.25); }
    .expand-row { display: none; }
    .expand-row.open { display: table-row; }
  </style>
</head>
<body class="bg-dark-900 text-gray-300">

  <header class="bg-dark-800 border-b border-dark-600 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex items-center h-14 gap-3">
        <div class="bg-gradient-to-r from-gold to-yellow-700 text-dark-900 px-3 py-1 rounded-full text-sm font-bold">WINE</div>
        <span class="font-serif font-bold text-gold">管理画面</span>
        <div class="ml-auto flex gap-3 items-center">
          <a href="/admin/import" class="text-sm bg-dark-600 text-gold hover:bg-dark-500 px-3 py-1.5 rounded-lg font-medium transition border border-dark-500">一括インポート</a>
          <a href="/admin/photos" class="text-sm bg-dark-600 text-gold hover:bg-dark-500 px-3 py-1.5 rounded-lg font-medium transition border border-dark-500">写真一括登録</a>
          <a href="/" class="text-sm text-gray-500 hover:text-gold transition">サイトに戻る</a>
          <button onclick="logout()" class="text-sm text-red-400 hover:text-red-300 transition">ログアウト</button>
        </div>
      </div>
    </div>
  </header>

  <div id="authCheck" class="text-center py-20 text-gray-500">認証確認中...</div>

  <div id="adminContent" class="hidden max-w-7xl mx-auto px-4 py-6">

    <!-- 統計カード -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6" id="statsGrid"></div>

    <!-- タブ -->
    <div class="flex gap-2 mb-5 flex-wrap">
      <button onclick="switchTab('users')" id="btn-users" class="tab-active px-4 py-2 rounded-lg text-sm font-medium transition">ユーザー</button>
      <button onclick="switchTab('pending')" id="btn-pending" class="tab-inactive px-4 py-2 rounded-lg text-sm font-medium transition">承認待ち <span id="pendingBadge" class="ml-1 bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full hidden"></span></button>
      <button onclick="switchTab('auctions')" id="btn-auctions" class="tab-inactive px-4 py-2 rounded-lg text-sm font-medium transition">オークション</button>
      <button onclick="switchTab('orders')" id="btn-orders" class="tab-inactive px-4 py-2 rounded-lg text-sm font-medium transition">注文</button>
      <button onclick="switchTab('watchlist')" id="btn-watchlist" class="tab-inactive px-4 py-2 rounded-lg text-sm font-medium transition">ウォッチリスト</button>
    </div>

    <!-- ユーザータブ -->
    <div id="tab-users" class="fade-in">
      <div class="flex gap-2 mb-4">
        <input type="text" id="userSearch" placeholder="ユーザー名・メール検索..." onkeyup="debounce(loadUsers, 400)()"
          class="bg-dark-700 border border-dark-500 text-gray-200 rounded-lg px-3 py-2 text-sm flex-1 focus:outline-none focus:border-gold placeholder-gray-600">
      </div>
      <div class="bg-dark-800 rounded-xl border border-dark-600 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-dark-700 border-b border-dark-600">
            <tr>
              <th class="text-left px-4 py-3 text-gray-500 font-medium">ユーザー</th>
              <th class="text-left px-4 py-3 text-gray-500 font-medium hidden sm:table-cell">メール</th>
              <th class="text-center px-4 py-3 text-gray-500 font-medium">取引</th>
              <th class="text-center px-4 py-3 text-gray-500 font-medium">ステータス</th>
              <th class="text-center px-4 py-3 text-gray-500 font-medium">操作</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
        <div id="usersPager" class="flex justify-center gap-2 p-4 border-t border-dark-600"></div>
      </div>
    </div>

    <!-- 承認待ちタブ -->
    <div id="tab-pending" class="hidden fade-in">
      <div class="bg-dark-800 rounded-xl border border-dark-600 overflow-hidden" id="pendingContainer">
        <div class="text-center py-8 text-gray-500">読み込み中...</div>
      </div>
    </div>

    <!-- オークションタブ -->
    <div id="tab-auctions" class="hidden fade-in">
      <div class="flex gap-2 mb-4">
        <select id="auctionStatus" onchange="loadAuctions(1)"
          class="bg-dark-700 border border-dark-500 text-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-gold">
          <option value="">すべて</option>
          <option value="active">開催中</option>
          <option value="ended">終了済み</option>
        </select>
      </div>
      <div class="bg-dark-800 rounded-xl border border-dark-600 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-dark-700 border-b border-dark-600">
            <tr>
              <th class="text-left px-4 py-3 text-gray-500 font-medium">商品</th>
              <th class="text-left px-4 py-3 text-gray-500 font-medium hidden sm:table-cell">出品者</th>
              <th class="text-right px-4 py-3 text-gray-500 font-medium">現在価格</th>
              <th class="text-center px-4 py-3 text-gray-500 font-medium">ステータス</th>
              <th class="text-center px-4 py-3 text-gray-500 font-medium">操作</th>
            </tr>
          </thead>
          <tbody id="auctionsTable"></tbody>
        </table>
        <div id="auctionsPager" class="flex justify-center gap-2 p-4 border-t border-dark-600"></div>
      </div>
    </div>

    <!-- 注文タブ -->
    <div id="tab-orders" class="hidden fade-in">
      <div class="flex gap-2 mb-4">
        <select id="orderStatusFilter" onchange="loadOrders(1)"
          class="bg-dark-700 border border-dark-500 text-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-gold">
          <option value="">すべて</option>
          <option value="pending_payment">入金待ち</option>
          <option value="paid">入金済</option>
          <option value="shipped">発送済</option>
          <option value="delivered">配達完了</option>
          <option value="completed">完了</option>
        </select>
      </div>
      <div class="bg-dark-800 rounded-xl border border-dark-600 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-dark-700 border-b border-dark-600">
            <tr>
              <th class="text-left px-4 py-3 text-gray-500 font-medium">商品</th>
              <th class="text-left px-4 py-3 text-gray-500 font-medium hidden sm:table-cell">落札者</th>
              <th class="text-right px-4 py-3 text-gray-500 font-medium">金額</th>
              <th class="text-center px-4 py-3 text-gray-500 font-medium">フルフィルメント</th>
              <th class="text-left px-4 py-3 text-gray-500 font-medium hidden md:table-cell">配送先</th>
              <th class="text-center px-4 py-3 text-gray-500 font-medium">操作</th>
            </tr>
          </thead>
          <tbody id="ordersTable"></tbody>
        </table>
        <div id="ordersPager" class="flex justify-center gap-2 p-4 border-t border-dark-600"></div>
      </div>
    </div>

    <!-- ウォッチリストタブ -->
    <div id="tab-watchlist" class="hidden fade-in">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-serif text-gold text-lg">ウォッチリスト分析</h2>
        <button onclick="downloadWatchlistCsv()" class="bg-dark-600 text-gold hover:bg-dark-500 px-4 py-2 rounded-lg text-sm font-medium transition border border-dark-500">CSV ダウンロード</button>
      </div>
      <div class="bg-dark-800 rounded-xl border border-dark-600 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-dark-700 border-b border-dark-600">
            <tr>
              <th class="text-left px-4 py-3 text-gray-500 font-medium">ワイン名</th>
              <th class="text-left px-4 py-3 text-gray-500 font-medium hidden sm:table-cell">生産者</th>
              <th class="text-right px-4 py-3 text-gray-500 font-medium">現在価格</th>
              <th class="text-center px-4 py-3 text-gray-500 font-medium">ウォッチ数</th>
              <th class="text-center px-4 py-3 text-gray-500 font-medium">ステータス</th>
            </tr>
          </thead>
          <tbody id="watchlistTable"></tbody>
        </table>
        <div id="watchlistPager" class="flex justify-center gap-2 p-4 border-t border-dark-600"></div>
      </div>
    </div>
  </div>

  <!-- ユーザー詳細モーダル -->
  <div id="userModal" class="fixed inset-0 bg-black bg-opacity-70 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-dark-800 border border-dark-600 rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between p-5 border-b border-dark-600">
        <h2 class="font-serif font-bold text-gold text-lg">ユーザー詳細</h2>
        <button onclick="closeUserModal()" class="text-gray-500 hover:text-gold text-2xl leading-none transition">&times;</button>
      </div>
      <div id="userModalContent" class="p-5">
        <div class="text-center py-8 text-gray-500">読み込み中...</div>
      </div>
    </div>
  </div>

  <!-- 承認/否認モーダル -->
  <div id="approvalModal" class="fixed inset-0 bg-black bg-opacity-70 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-dark-800 border border-dark-600 rounded-2xl shadow-2xl w-full max-w-md p-6">
      <h2 class="font-serif font-bold text-gold text-lg mb-4" id="approvalModalTitle">オークション審査</h2>
      <div id="approvalModalBody"></div>
      <div class="flex gap-3 mt-5">
        <button onclick="closeApprovalModal()" class="flex-1 border border-dark-500 text-gray-400 py-2 rounded-xl text-sm hover:bg-dark-700 transition">キャンセル</button>
        <button id="approvalModalConfirmBtn" class="flex-1 py-2 rounded-xl text-sm font-bold text-white transition"></button>
      </div>
    </div>
  </div>

  <!-- 注文ステータス変更モーダル -->
  <div id="orderModal" class="fixed inset-0 bg-black bg-opacity-70 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-dark-800 border border-dark-600 rounded-2xl shadow-2xl w-full max-w-md p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-serif font-bold text-gold text-lg">注文ステータス変更</h2>
        <button onclick="closeOrderModal()" class="text-gray-500 hover:text-gold text-2xl leading-none transition">&times;</button>
      </div>
      <div id="orderModalBody"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) location.href = '/login';

    const FULFILLMENT_MAP = {
      pending_payment: { label: '入金待ち', bg: 'bg-yellow-900/40', text: 'text-yellow-400', border: 'border-yellow-700/50' },
      paid:            { label: '入金済',   bg: 'bg-blue-900/40',   text: 'text-blue-400',   border: 'border-blue-700/50' },
      shipped:         { label: '発送済',   bg: 'bg-indigo-900/40', text: 'text-indigo-400', border: 'border-indigo-700/50' },
      delivered:       { label: '配達完了', bg: 'bg-teal-900/40',   text: 'text-teal-400',   border: 'border-teal-700/50' },
      completed:       { label: '完了',     bg: 'bg-green-900/40',  text: 'text-green-400',  border: 'border-green-700/50' }
    };

    function fulfillmentBadge(status) {
      const s = FULFILLMENT_MAP[status] || { label: status || '不明', bg: 'bg-dark-600', text: 'text-gray-400', border: 'border-dark-500' };
      return `<span class="${s.bg} ${s.text} border ${s.border} text-xs px-2 py-0.5 rounded-full">${s.label}</span>`;
    }

    async function checkAdmin() {
      const res = await fetch('/api/auth/me', { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) { location.href = '/login'; return; }
      const user = await res.json();
      if (!user.is_admin) {
        document.getElementById('authCheck').innerHTML = '<p class="text-red-400 py-20 text-center">管理者権限がありません</p>';
        return;
      }
      document.getElementById('authCheck').classList.add('hidden');
      document.getElementById('adminContent').classList.remove('hidden');
      loadStats();
      loadUsers();
      loadPendingBadge();
    }

    async function loadPendingBadge() {
      try {
        const res = await fetch('/api/admin/auctions/pending', { headers: { Authorization: `Bearer ${token}` } });
        const { total } = await res.json();
        const badge = document.getElementById('pendingBadge');
        if (total > 0) { badge.textContent = total; badge.classList.remove('hidden'); }
      } catch(e) {}
    }

    async function loadStats() {
      const res = await fetch('/api/admin/stats', { headers: { Authorization: `Bearer ${token}` } });
      const s = await res.json();
      document.getElementById('statsGrid').innerHTML = [
        { label: 'ユーザー', value: s.users.toLocaleString(), icon: '' },
        { label: 'オークション', value: s.auctions.toLocaleString() + ' (' + s.active + ' 開催中)', icon: '' },
        { label: '入札数', value: s.bids.toLocaleString(), icon: '' },
        { label: '売上', value: '¥' + (s.revenue||0).toLocaleString() + ' (' + s.paid + '件)', icon: '' },
      ].map(c => `
        <div class="bg-dark-800 rounded-xl border border-dark-600 p-4 hover:border-gold/25 transition">
          <p class="text-xs text-gray-500 mb-1">${c.label}</p>
          <p class="text-xl font-bold text-gold">${c.value}</p>
        </div>`).join('');
    }

    async function loadUsers(page = 1) {
      const q = document.getElementById('userSearch').value;
      const res = await fetch(`/api/admin/users?q=${encodeURIComponent(q)}&page=${page}`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const { users, total, pages } = await res.json();

      document.getElementById('usersTable').innerHTML = users.map(u => `
        <tr class="border-b border-dark-600 hover:bg-dark-700/50 transition">
          <td class="px-4 py-3">
            <button onclick="openUserModal(${u.id})" class="text-left">
              <div class="font-medium text-gray-200 hover:text-gold transition">${u.display_name || u.username}</div>
              <div class="text-xs text-gray-500">@${u.username}</div>
            </button>
            <div class="flex gap-1 mt-1 flex-wrap">
              ${u.is_admin ? '<span class="text-xs bg-gold/15 text-gold px-1.5 rounded border border-gold/30">管理者</span>' : ''}
              ${u.is_verified_seller ? '<span class="text-xs bg-blue-900/40 text-blue-400 px-1.5 rounded border border-blue-700/50">認定セラー</span>' : ''}
              ${u.email_verified ? '<span class="text-xs bg-green-900/40 text-green-400 px-1.5 rounded border border-green-700/50">メール確認済</span>' : '<span class="text-xs bg-yellow-900/40 text-yellow-400 px-1.5 rounded border border-yellow-700/50">未確認</span>'}
            </div>
          </td>
          <td class="px-4 py-3 text-gray-400 hidden sm:table-cell">${u.email}</td>
          <td class="px-4 py-3 text-center text-gray-300">${u.trade_count}</td>
          <td class="px-4 py-3 text-center">
            ${u.is_blocked
              ? '<span class="bg-red-900/40 text-red-400 text-xs px-2 py-0.5 rounded-full border border-red-700/50">停止</span>'
              : '<span class="bg-green-900/40 text-green-400 text-xs px-2 py-0.5 rounded-full border border-green-700/50">正常</span>'}
          </td>
          <td class="px-4 py-3 text-center">
            <div class="flex gap-1 justify-center flex-wrap">
              <button onclick="toggleBlock(${u.id}, ${u.is_blocked})"
                class="${u.is_blocked ? 'bg-green-900/30 text-green-400 hover:bg-green-900/50 border border-green-700/40' : 'bg-red-900/30 text-red-400 hover:bg-red-900/50 border border-red-700/40'} text-xs px-2 py-1 rounded transition">
                ${u.is_blocked ? '停止解除' : '停止'}
              </button>
              ${!u.is_admin ? `<button onclick="toggleAdmin(${u.id}, false)"
                class="bg-gold/10 text-gold hover:bg-gold/20 border border-gold/30 text-xs px-2 py-1 rounded transition">管理者に</button>` : ''}
              <button onclick="openUserModal(${u.id})"
                class="bg-dark-600 text-gray-400 hover:bg-dark-500 border border-dark-500 text-xs px-2 py-1 rounded transition">詳細</button>
            </div>
          </td>
        </tr>
      `).join('') || '<tr><td colspan="5" class="text-center py-8 text-gray-500">ユーザーがいません</td></tr>';

      renderPager('usersPager', page, pages, loadUsers);
    }

    async function openUserModal(userId) {
      document.getElementById('userModal').classList.remove('hidden');
      document.getElementById('userModalContent').innerHTML = '<div class="text-center py-8 text-gray-500">読み込み中...</div>';
      try {
        const res = await fetch(`/api/admin/users/${userId}`, { headers: { Authorization: `Bearer ${token}` } });
        const u = await res.json();

        const licenseStatus = u.license_verified
          ? '<span class="bg-green-900/40 text-green-400 text-xs px-2 py-0.5 rounded-full border border-green-700/50">確認済み</span>'
          : u.license_image_url
            ? '<span class="bg-yellow-900/40 text-yellow-400 text-xs px-2 py-0.5 rounded-full border border-yellow-700/50">審査中</span>'
            : '<span class="bg-dark-600 text-gray-500 text-xs px-2 py-0.5 rounded-full border border-dark-500">未提出</span>';

        document.getElementById('userModalContent').innerHTML = `
          <div class="space-y-4">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-full bg-gradient-to-br from-gold to-yellow-700 flex items-center justify-center text-dark-900 font-bold text-lg">
                ${(u.display_name || u.username)[0].toUpperCase()}
              </div>
              <div>
                <p class="font-bold text-gray-100">${u.display_name || u.username}</p>
                <p class="text-xs text-gray-500">@${u.username}</p>
              </div>
            </div>

            <div class="grid grid-cols-2 gap-3 text-sm">
              <div class="bg-dark-700 rounded-lg p-3 border border-dark-600">
                <p class="text-xs text-gray-500 mb-1">メール</p>
                <p class="text-gray-200">${u.email}</p>
                ${u.email_verified ? '<span class="text-xs text-green-400">確認済</span>' : '<span class="text-xs text-yellow-400">未確認</span>'}
              </div>
              <div class="bg-dark-700 rounded-lg p-3 border border-dark-600">
                <p class="text-xs text-gray-500 mb-1">氏名 / 電話</p>
                <p class="text-gray-200">${u.full_name || '—'}</p>
                <p class="text-gray-500 text-xs">${u.phone || '—'}</p>
              </div>
              <div class="bg-dark-700 rounded-lg p-3 border border-dark-600">
                <p class="text-xs text-gray-500 mb-1">取引 / 評価</p>
                <p class="text-gray-200">${u.trade_count}件 / ${(u.rating || 5.0).toFixed(1)}</p>
              </div>
              <div class="bg-dark-700 rounded-lg p-3 border border-dark-600">
                <p class="text-xs text-gray-500 mb-1">登録日</p>
                <p class="text-gray-200">${new Date(u.created_at).toLocaleDateString('ja-JP')}</p>
              </div>
              <div class="bg-dark-700 rounded-lg p-3 border border-dark-600 col-span-2">
                <p class="text-xs text-gray-500 mb-1">生年月日</p>
                <p class="text-gray-200">${u.birthdate ? new Date(u.birthdate).toLocaleDateString('ja-JP') : '—'}</p>
              </div>
            </div>

            ${u.address_pref || u.address_city ? `
            <div class="bg-dark-700 rounded-lg p-3 text-sm border border-dark-600">
              <p class="text-xs text-gray-500 mb-1">住所</p>
              <p class="text-gray-200">${[u.address_zip, u.address_pref, u.address_city, u.address_street].filter(Boolean).join(' ')}</p>
            </div>` : ''}

            ${u.bank_name ? `
            <div class="bg-dark-700 rounded-lg p-3 text-sm border border-dark-600">
              <p class="text-xs text-gray-500 mb-1">振込先口座</p>
              <p class="text-gray-200">${u.bank_name} ${u.bank_branch} ${u.bank_account_type}  ${u.bank_account_number}</p>
              <p class="text-gray-500 text-xs">${u.bank_account_holder || ''}</p>
            </div>` : ''}

            <div class="border border-dark-600 rounded-xl p-4">
              <div class="flex items-center justify-between mb-3">
                <h3 class="font-medium text-gray-300 text-sm">本人確認書類</h3>
                ${licenseStatus}
              </div>
              ${u.license_image_url
                ? `<img src="${u.license_image_url}" class="w-full max-h-48 object-contain rounded-lg border border-dark-600 mb-3" alt="本人確認書類">`
                : '<p class="text-sm text-gray-500 mb-3">書類が提出されていません</p>'}
              ${u.license_image_url && !u.license_verified ? `
              <div class="flex gap-2">
                <button onclick="reviewLicense(${u.id}, true)" class="flex-1 bg-green-700 text-white py-2 rounded-lg text-sm font-medium hover:bg-green-600 transition">承認する</button>
                <button onclick="reviewLicense(${u.id}, false)" class="flex-1 bg-red-900/40 text-red-400 py-2 rounded-lg text-sm font-medium hover:bg-red-900/60 border border-red-700/50 transition">否認する</button>
              </div>` : ''}
              ${u.license_verified ? `

    async function loadUserHistory(userId) {
      const container = document.getElementById('userHistoryContent');
      container.innerHTML = '<div class="text-center py-4 text-gray-500">読み込み中...</div>';
      try {
        const res = await fetch(`/api/admin/users/${userId}/history`, { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) throw new Error('Failed');
        const data = await res.json();
        let html = '';

        // 入札履歴
        html += '<p class="text-gold text-xs font-medium mb-2 mt-2">入札履歴</p>';
        if (data.bids && data.bids.length) {
          html += `<div class="overflow-x-auto"><table class="w-full text-xs mb-4">
            <thead><tr class="border-b border-dark-600">
              <th class="text-left py-2 text-gray-500">商品</th>
              <th class="text-right py-2 text-gray-500">入札額</th>
              <th class="text-right py-2 text-gray-500">日時</th>
            </tr></thead><tbody>`;
          data.bids.forEach(b => {
            html += `<tr class="border-b border-dark-700">
              <td class="py-1.5 text-gray-300">${b.title || b.auction_id}</td>
              <td class="py-1.5 text-right text-gray-200">¥${Number(b.amount).toLocaleString()}</td>
              <td class="py-1.5 text-right text-gray-500">${new Date(b.created_at).toLocaleDateString('ja-JP')}</td>
            </tr>`;
          });
          html += '</tbody></table></div>';
        } else {
          html += '<p class="text-gray-600 text-xs mb-4">入札履歴はありません</p>';
        }

        // 出品履歴
        html += '<p class="text-gold text-xs font-medium mb-2">出品履歴</p>';
        if (data.listings && data.listings.length) {
          html += `<div class="overflow-x-auto"><table class="w-full text-xs">
            <thead><tr class="border-b border-dark-600">
              <th class="text-left py-2 text-gray-500">商品</th>
              <th class="text-right py-2 text-gray-500">開始価格</th>
              <th class="text-center py-2 text-gray-500">状態</th>
              <th class="text-right py-2 text-gray-500">日時</th>
            </tr></thead><tbody>`;
          data.listings.forEach(l => {
            html += `<tr class="border-b border-dark-700">
              <td class="py-1.5 text-gray-300">${l.title}</td>
              <td class="py-1.5 text-right text-gray-200">¥${Number(l.starting_price).toLocaleString()}</td>
              <td class="py-1.5 text-center">${l.status === 'active' ? '<span class="text-green-400">開催中</span>' : '<span class="text-gray-500">終了</span>'}</td>
              <td class="py-1.5 text-right text-gray-500">${new Date(l.created_at).toLocaleDateString('ja-JP')}</td>
            </tr>`;
          });
          html += '</tbody></table></div>';
        } else {
          html += '<p class="text-gray-600 text-xs">出品履歴はありません</p>';
        }

        container.innerHTML = html;
      } catch(e) {
        container.innerHTML = '<div class="text-center py-4 text-red-400">履歴の読み込みに失敗しました</div>';
      }
    }

    async function downloadUserHistoryCsv(userId) {
      try {
        const res = await fetch(`/api/admin/users/${userId}/history/csv`, { headers: { Authorization: `Bearer ${token}` } });
        if (!res.ok) throw new Error('Failed');
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `user_${userId}_history.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch(e) {
        alert('CSVダウンロードに失敗しました');
      }
    }

    async function approveAuction(id) {
      if (!confirm('このオークションを承認して公開しますか？')) return;
      const res = await fetch(`/api/admin/auctions/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ status: 'active' })

      if (res.ok) { loadPending(); loadStats(); }

      rejectAuctionId = id;

        <p class="text-sm text-gray-400 mb-3">「${title}」 の出品を否認します。出品者にメールで通知されます。</p>

      const btn = document.getElementById('approvalModalConfirmBtn');
      btn.textContent = '否認する';

    async function confirmReject() {

        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },

      const newStatus = document.getElementById('orderNewStatus').value;
      const carrier = document.getElementById('orderCarrier').value.trim();

    function renderPager(containerId, page, pages, loadFn) {
      if (pages <= 1) { document.getElementById(containerId).innerHTML = ''; return; }
      const btns = [];
      for (let i = 1; i <= pages; i++) {
        btns.push(`<button onclick="${loadFn.name}(${i})"
          class="${i === page ? 'bg-gold text-dark-900 font-bold' : 'bg-dark-600 text-gray-400 hover:bg-dark-500 border border-dark-500'} px-3 py-1 rounded text-sm transition">${i}</button>`);
      }
      document.getElementById(containerId).innerHTML = btns.join('');
    }

    function switchTab(name) {
      ['users', 'pending', 'auctions', 'orders', 'watchlist'].forEach(t => {
        document.getElementById(`btn-${t}`).className = t === name ? 'tab-active px-4 py-2 rounded-lg text-sm font-medium transition' : 'tab-inactive px-4 py-2 rounded-lg text-sm font-medium transition';
        document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== name);
      });
      if (name === 'pending') loadPending();
      if (name === 'auctions') loadAuctions();
      if (name === 'orders') loadOrders();
      if (name === 'watchlist') loadWatchlist();
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      location.href = '/';
    }

    let debounceTimer;
    function debounce(fn, ms) {
      return (...args) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => fn(...args), ms);
      };
    }

    checkAdmin();
  </script>
</body>
</html>
