<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品詳細 — WineBank</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: { DEFAULT: '#A78450', hover: '#8B6914', dim: 'rgba(167,132,80,0.15)' },
            dark: { 900: '#0A0A0A', 800: '#141414', 700: '#1C1C1C', 600: '#252525', 500: '#2F2F2F' }
          },
          fontFamily: {
            serif: ['"Noto Serif JP"', 'serif'],
            sans: ['Inter', '"Noto Sans JP"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;500;700&display=swap');
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
    h1, h2, h3, .heading, .font-serif { font-family: 'Noto Serif JP', serif; }

    .wine-badge { background: linear-gradient(135deg, #A78450, #8B6914); }
    .bid-btn { background: #A78450; color: #0A0A0A; transition: all 0.2s; }
    .bid-btn:hover { background: #8B6914; transform: translateY(-1px); }
    .bid-btn:disabled { background: #4a4a4a; color: #888; transform: none; cursor: not-allowed; }
    .timer-block { background: linear-gradient(135deg, #141414, #1C1C1C); border: 1px solid rgba(255,255,255,0.05); }
    .timer-digit { font-size: 2.2rem; font-weight: 800; letter-spacing: 0.05em; }
    .tag-pill { background: transparent; color: rgba(255,255,255,0.4); border: 1px solid rgba(255,255,255,0.1); }
    .winning { background: rgba(167,132,80,0.08); border-color: #A78450; }
    .losing { background: rgba(239,68,68,0.08); border-color: #EF4444; }
    .modal-overlay { backdrop-filter: blur(4px); }
    .bid-row:first-child td { background: rgba(167,132,80,0.06); }
    .bid-row:nth-child(even) td { background: rgba(255,255,255,0.02); }
    .score-badge { background: linear-gradient(135deg, #A78450, #8B6914); }
    .winemark { background: #141414; border: 1px solid #A78450; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    .progress-bar { background: linear-gradient(90deg, #A78450, #8B6914); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes priceUp { 0% { transform: scale(1.15); color: #A78450; } 100% { transform: scale(1); color: inherit; } }
    .price-update { animation: priceUp 0.6s ease; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.6; } }
    .pulse { animation: pulse 1s infinite; }

    /* スクロールバー */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0A0A0A; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #A78450; }
  </style>
</head>
<body class="bg-dark-900 min-h-screen text-white/90">

  <!-- ヘッダー -->
  <header class="bg-dark-800/95 backdrop-blur-md border-b border-white/5 sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4">
      <div class="flex items-center h-14 gap-2">
        <a href="/" class="text-white/40 hover:text-white/70 flex-shrink-0 p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <a href="/" class="flex items-center gap-2 flex-shrink-0 text-gold">
          <svg class="h-5" viewBox="0 0 176.426 30.418" xmlns="http://www.w3.org/2000/svg" fill="currentColor"><path d="M20.687 9.871l8.482 20.55 3.669-8.887L24.355.984z"/><path d="M40.909 1.975l-.069.168c.26-.631.581-1.159 1.295-1.159h1.263V0H32.039v.984h1.12c.714 0 1.035.528 1.3 1.159l.008.02.007.017.011.027 3.165 7.666z"/><path d="M9.691 1.982l-.011-.026.011.026c-.311-.753-.136-1 .7-1h.963V0H0v.984h1.123c.714 0 1.035.528 1.3 1.159l-.152-.368L14.09 30.416l3.669-8.887-8.044-19.49-.023-.057"/><path d="M38.609 15.697h2.29v13.7h-2.29v.916h8.98v-.916h-2.29v-13.7h2.29v-.916h-8.98z"/><path d="M60.602 15.697a10.273 10.273 0 011.551.034c.563.036.563.317.6 1.057v7.009l-7.643-9.016h-6.13v.916a12.094 12.094 0 011.727.034c.527.036.527.247.563 1.093v11.3c-.036 1.021-.14 1.233-.881 1.233H48.98v.951h5.917v-.951h-1.584c-.81-.034-.846-.352-.881-1.233V17.879l10.46 12.539h1.021v-13.63c.036-.669.071-.986.494-1.057.1-.034 1.62-.034 1.831-.034v-.916h-5.636z"/><path d="M76.663 29.397h-2.432v-6.515c2.572 0 3.311.21 3.558 2.887h.917v-6.412h-.917c-.176 2.36-.917 2.571-3.558 2.571v-6.231h3.45c2.183.106 3.1.352 3.943 3.2h.881l-.352-4.12H67.54v.916h2.29v13.7h-2.29v.916h15.215l.387-5.071h-.881c-1.09 4.085-3.168 4.12-5.6 4.155"/><path d="M128.892 14.322h-1.057l-5.669 13.594c-.53 1.093-.634 1.2-.846 1.338-.247.141-.283.141-2.078.141v.916h6.128v-.916c-2.078 0-2.43 0-2.43-.6a1.414 1.414 0 01.1-.493l1.022-2.571 2.677-6.445 2.4 6.445 1.373 3.662h-2.183v.916h8.522v-.916h-1.936z"/><path d="M149.37 15.697a10.271 10.271 0 011.551.034c.563.036.563.317.6 1.057v7.009l-7.643-9.016h-6.128v.916a12.1 12.1 0 011.727.034c.527.036.527.247.563 1.093v11.3c-.036 1.021-.14 1.233-.881 1.233h-1.409v.951h5.917v-.951h-1.584c-.81-.034-.846-.352-.881-1.233V17.879l10.461 12.539h1.021v-13.63c.036-.669.071-.986.494-1.057.1-.034 1.62-.034 1.831-.034v-.916h-5.636z"/><path d="M162.927 15.697h2.115v-.916h-8.733v.916h2.29v13.7h-2.29v.916h8.733v-.916h-2.111z"/><path d="M171.597 26.427c-1.322-1.374-4.939-5.941-4.939-5.941l3.242-3.417a4.648 4.648 0 011.831-1.3 7.609 7.609 0 011.8-.07v-.915h-6.622v.915h1.9c.1 0 .351.034.351.246a1.236 1.236 0 01-.316.6l-5.636 5.988s3.487 4.883 5.5 6.415c2.855 2.174 5.784 1.6 7.719-.549-2.064.551-3.461-.548-4.828-1.968"/><path d="M112.157 14.491c3.782-.634 5.674-3.911 5.674-7.19 0-3.651-2.345-7.3-7.034-7.3H94.602v1.087h2.8c.011.111.017.226.017.348v27.609a3.041 3.041 0 01-.023.364h-2.8v1.009h17.362c5.044 0 7.566-3.954 7.566-7.908 0-3.9-2.459-7.916-7.373-8.019m-.276-7.19c0 3.651-3.183 6.541-7.872 6.541h-.584V1.437c0-.122.006-.238.017-.348h1.405c4.689 0 7.034 2.562 7.034 6.213m-7.034 22.108h-1.4a3.309 3.309 0 01-.024-.428v.428-14.558h1.893c5.044 0 8.262 3.705 8.262 7.659s-3.689 6.9-8.733 6.9"/></svg>
        </a>
        <div class="ml-auto flex items-center gap-3">
          <button id="watchBtn" onclick="toggleWatch()" class="text-white/40 hover:text-gold transition p-1">
            <svg class="w-6 h-6" id="watchIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
          </button>
          <a href="/mypage" class="text-sm text-white/60 hover:text-white/90 hidden" id="mypageLinkHeader">マイページ</a>
          <span class="text-sm text-white/70 font-medium hidden max-w-24 truncate" id="headerUser"></span>
          <a href="/login" class="bg-gold text-dark-900 text-sm px-4 py-1.5 rounded-full hover:bg-gold-hover font-medium flex-shrink-0" id="headerLoginBtn">ログイン</a>
        </div>
      </div>
    </div>
  </header>

  <div class="max-w-6xl mx-auto px-4 py-6" id="mainContent">
    <!-- ローディング -->
    <div class="text-center py-20" id="loadingState">
      <div class="text-4xl mb-4 pulse">🍷</div>
      <p class="text-white/40">読み込み中...</p>
    </div>
  </div>

  <!-- 入札履歴モーダル -->
  <div id="historyModal" class="fixed inset-0 z-50 hidden">
    <div class="modal-overlay absolute inset-0 bg-black bg-opacity-60" onclick="closeHistory()"></div>
    <div class="absolute right-0 top-0 h-full w-full max-w-md bg-dark-800 shadow-2xl flex flex-col fade-in border-l border-white/5">
      <div class="flex items-center justify-between p-4 border-b border-white/10">
        <div>
          <h2 class="font-bold text-white/90 font-serif text-lg">入札履歴</h2>
          <p class="text-xs text-white/40 mt-0.5" id="historySubtitle">読み込み中...</p>
        </div>
        <button onclick="closeHistory()" class="text-white/40 hover:text-white/70">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="p-4 bg-dark-700 border-b border-white/5 grid grid-cols-3 gap-3 text-center text-sm" id="historyStats"></div>
      <div class="flex-1 overflow-y-auto" id="historyList"></div>
    </div>
  </div>

  <!-- 入札確認モーダル -->
  <div id="bidModal" class="fixed inset-0 z-50 hidden items-center justify-center">
    <div class="absolute inset-0 bg-black bg-opacity-60" onclick="closeBidModal()"></div>
    <div class="relative bg-dark-800 border border-white/10 rounded-2xl shadow-2xl p-6 mx-4 w-full max-w-sm fade-in">
      <h2 class="font-bold text-white/90 text-lg mb-1 font-serif">入札の確認</h2>
      <p class="text-white/40 text-sm mb-4">以下の内容で入札します</p>
      <div class="bg-dark-700 rounded-xl p-4 mb-4 border border-white/5">
        <div class="flex justify-between text-sm mb-2">
          <span class="text-white/40">商品</span>
          <span class="font-medium text-white/90 text-right text-xs max-w-32 truncate" id="confirmTitle"></span>
        </div>
        <div class="flex justify-between text-sm mb-2">
          <span class="text-white/40">現在の価格</span>
          <span class="text-white/70" id="confirmCurrentPrice"></span>
        </div>
        <div class="flex justify-between pt-2 border-t border-white/10">
          <span class="font-bold text-white/90">入札金額</span>
          <span class="font-bold text-2xl text-gold font-serif" id="confirmBidPrice"></span>
        </div>
      </div>
      <div class="bg-dark-700 border border-gold/20 rounded-lg p-3 mb-4 text-xs text-gold/80">
        ⚠️ 落札した場合、購入義務が生じます。キャンセルはできません。
      </div>
      <div class="flex gap-3">
        <button onclick="closeBidModal()" class="flex-1 border border-white/10 rounded-xl py-3 text-white/70 font-medium hover:bg-dark-600 transition">キャンセル</button>
        <button onclick="confirmBid()" id="confirmBidBtn" class="flex-1 bid-btn rounded-xl py-3 font-bold">入札する</button>
      </div>
    </div>
  </div>

  <!-- トースト -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-dark-800 border border-white/10 text-white px-6 py-3 rounded-full text-sm font-medium shadow-lg z-50 hidden transition-all max-w-sm text-center"></div>

  <script>
    const token = localStorage.getItem('token');
    const currentUser = JSON.parse(localStorage.getItem('user') || 'null');
    const auctionId = new URLSearchParams(location.search).get('id');
    let auction = null;
    let pendingBidAmount = 0;
    let timerInterval = null;

    // ヘッダー認証表示
    if (currentUser) {
      document.getElementById('headerLoginBtn').classList.add('hidden');
      document.getElementById('headerUser').textContent = currentUser.display_name || currentUser.username;
      document.getElementById('headerUser').classList.remove('hidden');
      document.getElementById('mypageLinkHeader').classList.remove('hidden');
    }

    if (!auctionId) {
      location.href = '/';
    }

    // Socket.io
    let socket;
    try {
      socket = io();
      socket.emit('join:auction', parseInt(auctionId));

      socket.on('bid:new', (data) => {
        if (data.auction_id !== parseInt(auctionId)) return;

        const wasTopBidder = auction && auction.is_top_bidder;
        updatePriceDisplay(data.new_price, data.bid_count, data.bidder_count);

        if (data.extended) {
          updateEndTime(data.end_time);
        }

        // 自分が最高入札者だったのに抜かれた場合
        if (wasTopBidder && currentUser && data.bidder_id !== currentUser.id) {
          showOutbidNotification(data.new_price);
          // ステータスを更新
          const statusBox = document.getElementById('bidStatusBox');
          if (statusBox) {
            statusBox.className = 'losing border rounded-lg p-3 flex items-center gap-2 mb-3';
            statusBox.innerHTML = `
              <svg class="w-4 h-4 text-red-400 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
              <p class="text-sm text-red-400 font-medium" id="bidStatusText">入札を上回られました（¥${data.new_price.toLocaleString()}）</p>`;
          }
          if (auction) auction.is_top_bidder = false;
        }
      });

      socket.on('auction:ended', (data) => {
        if (data.auction_id !== parseInt(auctionId)) return;
        showToast('🔔 このオークションは終了しました');
        loadAuction();
      });
    } catch(e) {}

    // オークション詳細取得
    async function loadAuction() {
      const headers = token ? { Authorization: `Bearer ${token}` } : {};
      try {
        const res = await fetch(`/api/auctions/${auctionId}`, { headers });
        if (!res.ok) throw new Error('not found');
        auction = await res.json();
        renderPage(auction);
      } catch(e) {
        document.getElementById('loadingState').innerHTML = '<p class="text-white/30 py-20 text-center">商品が見つかりませんでした</p>';
      }
    }

    function renderPage(a) {
      const isEnded = a.status !== 'active' || new Date(a.end_time) <= new Date();
      const isSeller = currentUser && currentUser.id === a.seller_id;
      const isTopBidder = a.is_top_bidder;
      const minBid = a.current_price + 1000;
      const progressPct = Math.min(100, ((a.current_price - a.starting_price) / Math.max(1, a.starting_price * 2)) * 100);

      // ウォッチアイコン
      if (a.is_watched) {
        document.getElementById('watchIcon').setAttribute('fill', '#A78450');
        document.getElementById('watchIcon').setAttribute('stroke', '#A78450');
      }

      // ステータス表示
      let statusHtml = '';
      if (isEnded) {
        if (isTopBidder) {
          statusHtml = `<div class="bg-gold/10 border border-gold/30 rounded-lg p-4 mb-3">
            <p class="text-gold font-bold text-sm mb-1">🎉 おめでとうございます！落札しました</p>
            <p class="text-gold/70 text-xs mb-3">落札金額: ¥${a.current_price.toLocaleString()}</p>
            <a href="/checkout?id=${a.id}" class="block w-full text-center bg-gold text-dark-900 py-2.5 rounded-lg font-bold text-sm hover:bg-gold-hover transition">
              💳 購入手続きへ →
            </a>
          </div>`;
        } else {
          statusHtml = `<div class="bg-dark-600 border border-white/10 rounded-lg p-3 flex items-center gap-2 mb-3">
            <span class="text-white/40 text-sm">このオークションは終了しました</span>
          </div>`;
        }
      } else if (!currentUser) {
        statusHtml = `<div class="bg-dark-600 border border-gold/20 rounded-lg p-3 flex items-center gap-2 mb-3">
          <span class="text-gold/80 text-sm">入札するには <a href="/login" class="font-bold underline text-gold">ログイン</a> が必要です</span>
        </div>`;
      } else if (isSeller) {
        statusHtml = `<div class="bg-dark-600 border border-gold/30 rounded-lg p-3 mb-3">
          <span class="text-gold/80 text-sm font-medium">📦 あなたの出品です</span>
        </div>`;
      } else if (isTopBidder) {
        statusHtml = `<div class="winning border rounded-lg p-3 flex items-center gap-2 mb-3" id="bidStatusBox">
          <svg class="w-4 h-4 text-gold flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
          <p class="text-sm text-gold font-medium" id="bidStatusText">現在の最高入札者です（¥${a.current_price.toLocaleString()}）</p>
        </div>`;
      } else {
        statusHtml = `<div class="bg-dark-600 border border-white/10 rounded-lg p-3 mb-3" id="bidStatusBox">
          <p class="text-sm text-white/50" id="bidStatusText">入札してみましょう</p>
        </div>`;
      }

      // 入札フォーム
      const bidFormHtml = (!isEnded && !isSeller) ? `
        <div>
          <div class="flex gap-2 mb-2">
            <div class="relative flex-1">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-white/40 font-medium">¥</span>
              <input type="number" id="bidInput" placeholder="${minBid.toLocaleString()}以上" min="${minBid}" step="1000"
                class="w-full bg-dark-600 border-2 border-white/10 rounded-xl pl-7 pr-3 py-3 text-lg font-bold text-white/90 focus:outline-none focus:border-gold transition"
                ${!currentUser ? 'disabled onclick="location.href=\'/login\'"' : ''}>
            </div>
            <button onclick="${currentUser ? 'placeBid()' : 'location.href=\"/login\"'}" class="bid-btn font-bold px-6 rounded-xl text-sm" id="bidSubmitBtn">
              ${currentUser ? '入札する' : 'ログイン'}
            </button>
          </div>
          <div class="flex gap-2 mb-2">
            ${[minBid, a.current_price + 5000, a.current_price + 10000, a.current_price + 25000].map(amt => `
              <button onclick="${currentUser ? `quickBid(${amt})` : 'location.href=\"/login\"'}" class="flex-1 text-xs border border-white/10 rounded-lg py-2 hover:border-gold/40 hover:bg-gold/5 transition text-white/50">
                +¥${(amt - a.current_price).toLocaleString()}<br><span class="text-white/30">¥${amt.toLocaleString()}</span>
              </button>`).join('')}
          </div>
          <p class="text-xs text-white/30 text-center">次の入札は ¥${minBid.toLocaleString()}以上</p>
        </div>` : '';

      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('mainContent').innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
          <!-- 左：画像 -->
          <div>
            <!-- メイン画像 -->
            <div class="bg-gradient-to-br ${a.image_color} rounded-2xl h-80 flex items-center justify-center mb-2 relative overflow-hidden" id="mainImageBox">
              ${(a.images && a.images.length > 0)
                ? `<img src="${a.images[0].url}" alt="${a.title}" class="w-full h-full object-cover" id="mainImg">`
                : a.image_url
                  ? `<img src="${a.image_url}" alt="${a.title}" class="w-full h-full object-cover" id="mainImg">`
                  : `<div class="text-center"><div class="text-8xl mb-3">${a.image_emoji}</div><p class="text-white text-sm opacity-80">${a.producer}</p></div>`}
              <div class="winemark absolute top-3 right-3 text-gold rounded-lg px-2 py-1 text-center" style="min-width:58px;">
                <div style="font-size:10px;font-weight:900;letter-spacing:0.5px;line-height:1.5;">WineBank</div>
                <div style="font-size:9px;line-height:1.3;">✓ 真贋済み</div>
              </div>
              ${a.score_rp ? `<div class="absolute top-3 left-3 score-badge text-dark-900 text-xs px-3 py-1 rounded-full font-bold">RP ${a.score_rp}点</div>` : ''}
              <div class="absolute bottom-3 left-3 bg-black bg-opacity-50 text-white text-xs px-2 py-1 rounded">${a.volume_ml}ml${a.condition_note ? ' / ' + a.condition_note : ''}</div>
            </div>

            <!-- サムネイル一覧 -->
            ${(a.images && a.images.length > 1) ? `
            <div class="flex gap-2 mb-3 overflow-x-auto pb-1">
              ${a.images.map((img, i) => `
                <button onclick="switchImage('${img.url}', this)"
                  class="flex-shrink-0 w-16 h-16 rounded-lg overflow-hidden border-2 ${i === 0 ? 'border-gold' : 'border-white/10'} hover:border-gold/60 transition">
                  <img src="${img.url}" alt="${img.label || ''}" class="w-full h-full object-cover">
                </button>
              `).join('')}
            </div>
            ` : ''}

            <!-- 画像ラベル表示 -->
            ${(a.images && a.images.length > 0) ? `
            <div class="flex gap-1 mb-3 flex-wrap" id="imageLabels">
              ${a.images.map((img, i) => img.label ? `
                <span class="text-xs bg-dark-600 text-white/40 px-2 py-0.5 rounded-full border border-white/5">${img.label}</span>
              ` : '').join('')}
            </div>` : ''}

            <!-- ワイン詳細テーブル -->
            <div class="bg-dark-700 rounded-xl border border-white/5 p-4">
              <h3 class="font-bold text-white/90 mb-3 text-sm font-serif text-lg">ワイン詳細</h3>
              <div class="grid grid-cols-2 gap-y-2 text-sm">
                <div class="text-white/40">生産者</div><div class="font-medium text-white/90">${a.producer}</div>
                ${a.vintage ? `<div class="text-white/40">ヴィンテージ</div><div class="font-medium text-white/90">${a.vintage}年</div>` : ''}
                ${a.region ? `<div class="text-white/40">産地</div><div class="font-medium text-white/90">${a.region}</div>` : ''}
                ${a.appellation ? `<div class="text-white/40">アペラシオン</div><div class="font-medium text-white/90">${a.appellation}</div>` : ''}
                ${a.grape ? `<div class="text-white/40">品種</div><div class="font-medium text-white/90">${a.grape}</div>` : ''}
                <div class="text-white/40">容量</div><div class="font-medium text-white/90">${a.volume_ml}ml</div>
                ${a.condition_note ? `<div class="text-white/40">保管状態</div><div class="font-medium text-white/90">${a.condition_note}</div>` : ''}
                ${(a.score_rp || a.score_ws) ? `<div class="text-white/40">スコア</div><div class="font-medium text-white/90">
                  ${a.score_rp ? `<span class="score-badge text-dark-900 text-xs px-2 py-0.5 rounded">RP ${a.score_rp}</span>` : ''}
                  ${a.score_ws ? `<span class="score-badge text-dark-900 text-xs px-2 py-0.5 rounded ml-1">WS ${a.score_ws}</span>` : ''}
                </div>` : ''}
              </div>
            </div>
          </div>

          <!-- 右：入札 -->
          <div>
            <div class="flex flex-wrap gap-2 mb-2">
              ${a.vintage ? `<span class="tag-pill text-xs px-2 py-0.5 rounded-full">${a.vintage}</span>` : ''}
              ${a.region ? `<span class="tag-pill text-xs px-2 py-0.5 rounded-full">${a.region}</span>` : ''}
              ${a.grape ? `<span class="tag-pill text-xs px-2 py-0.5 rounded-full">${a.grape.split('/')[0].trim()}</span>` : ''}
            </div>
            <h1 class="text-xl font-bold text-white/90 mb-1 font-serif text-2xl">${a.title}</h1>
            <p class="text-sm text-white/40 mb-4">${a.producer}${a.appellation ? ' / ' + a.appellation : ''}</p>

            <!-- タイマー -->
            <div class="timer-block rounded-xl p-4 mb-4">
              <div class="flex items-center justify-between mb-3">
                <p class="text-white/40 text-xs">${isEnded ? 'オークション終了' : 'オークション終了まで'}</p>
                <p class="text-white/40 text-xs" id="endDateLabel">${formatEndDate(a.end_time)}</p>
              </div>
              ${isEnded ? `<p class="text-center text-white/30 py-2">終了しました</p>` : `
              <div class="flex items-center gap-1 justify-center">
                <div class="text-center"><div class="timer-digit text-white" id="timer-h">00</div><div class="text-white/40 text-xs mt-1">時間</div></div>
                <div class="timer-digit text-gold mb-4">:</div>
                <div class="text-center"><div class="timer-digit text-white" id="timer-m">00</div><div class="text-white/40 text-xs mt-1">分</div></div>
                <div class="timer-digit text-gold mb-4">:</div>
                <div class="text-center"><div class="timer-digit text-white" id="timer-s">00</div><div class="text-white/40 text-xs mt-1">秒</div></div>
              </div>
              <p class="text-center text-white/30 text-xs mt-2">※ 終了5分以内の入札で自動延長されます</p>`}
            </div>

            <!-- 価格 -->
            <div class="bg-dark-700 rounded-xl border border-white/5 p-4 mb-4">
              <div class="flex items-center justify-between mb-3">
                <div>
                  <p class="text-xs text-white/40 mb-0.5">現在の価格</p>
                  <p class="text-3xl font-bold text-gold font-serif" id="currentPrice">¥${a.current_price.toLocaleString()}</p>
                  <p class="text-xs text-white/30 mt-0.5">開始価格 ¥${a.starting_price.toLocaleString()}</p>
                </div>
                <button onclick="openHistory()" class="text-sm text-gold hover:text-gold-hover border border-gold/30 rounded-full px-3 py-1.5 hover:bg-gold/5 transition">
                  入札履歴 <span id="bidCountBadge">${a.bid_count}</span>件 →
                </button>
              </div>
              <div class="mb-3">
                <div class="flex justify-between text-xs text-white/30 mb-1">
                  <span>¥${a.starting_price.toLocaleString()}</span>
                  <span id="bidderCountLabel">入札者 ${a.bidder_count}人</span>
                  <span id="maxPriceLabel">¥${(a.starting_price * 3).toLocaleString()}+</span>
                </div>
                <div class="h-1.5 bg-dark-500 rounded-full overflow-hidden">
                  <div class="progress-bar h-full rounded-full" id="progressBar" style="width: ${Math.max(5, progressPct)}%"></div>
                </div>
              </div>

              ${statusHtml}
              ${bidFormHtml}
            </div>

            <!-- 出品者 -->
            <div class="bg-dark-700 rounded-xl border border-white/5 p-4 mb-4">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gold/10 flex items-center justify-center text-gold font-bold text-lg">
                  ${(a.seller_name || a.seller_username || '?')[0].toUpperCase()}
                </div>
                <div class="flex-1">
                  <p class="font-medium text-white/90 text-sm">${a.seller_name || a.seller_username}</p>
                  <div class="flex items-center gap-2 text-xs text-white/40">
                    <span>⭐ ${(a.seller_rating || 5.0).toFixed(1)}</span>
                    <span>・取引 ${a.seller_trade_count || 0}件</span>
                    ${a.is_verified_seller ? '<span class="bg-gold/10 text-gold px-1.5 py-0.5 rounded border border-gold/20">認定セラー</span>' : ''}
                  </div>
                </div>
              </div>
            </div>

            <!-- 説明 -->
            <div class="bg-dark-700 rounded-xl border border-white/5 p-4">
              <h3 class="font-bold text-white/90 mb-2 text-sm font-serif text-lg">商品説明</h3>
              <p class="text-sm text-white/60 leading-relaxed whitespace-pre-line">${a.description || '説明なし'}</p>
            </div>
          </div>
        </div>`;

      // タイマー起動
      if (!isEnded) startTimer(new Date(a.end_time));
    }

    function startTimer(endTime) {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const diff = endTime - new Date();
        if (diff <= 0) {
          clearInterval(timerInterval);
          ['timer-h','timer-m','timer-s'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.textContent = '00';
          });
          showToast('🔔 オークションが終了しました');
          return;
        }
        const h = Math.floor(diff / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        const hEl = document.getElementById('timer-h');
        const mEl = document.getElementById('timer-m');
        const sEl = document.getElementById('timer-s');
        if (hEl) hEl.textContent = String(h).padStart(2,'0');
        if (mEl) mEl.textContent = String(m).padStart(2,'0');
        if (sEl) sEl.textContent = String(s).padStart(2,'0');
      }, 1000);
    }

    function updateEndTime(newEndTime) {
      auction.end_time = newEndTime;
      const el = document.getElementById('endDateLabel');
      if (el) el.textContent = formatEndDate(newEndTime);
      startTimer(new Date(newEndTime));
    }

    function updatePriceDisplay(newPrice, bidCount, bidderCount) {
      auction.current_price = newPrice;
      const priceEl = document.getElementById('currentPrice');
      if (priceEl) {
        priceEl.textContent = '¥' + newPrice.toLocaleString();
        priceEl.classList.remove('price-update');
        void priceEl.offsetWidth;
        priceEl.classList.add('price-update');
      }
      const badgeEl = document.getElementById('bidCountBadge');
      if (badgeEl) badgeEl.textContent = bidCount;
      const countEl = document.getElementById('bidderCountLabel');
      if (countEl) countEl.textContent = `入札者 ${bidderCount}人`;
    }

    // 入札
    let pendingBid = 0;

    function quickBid(amount) {
      document.getElementById('bidInput').value = amount;
      placeBid();
    }

    function placeBid() {
      if (!currentUser) { location.href = '/login'; return; }
      const input = document.getElementById('bidInput');
      const val = parseInt(input.value) || 0;
      const minBid = auction.current_price + 1000;
      if (val < minBid) {
        input.classList.add('border-red-400');
        showToast(`⚠️ ¥${minBid.toLocaleString()}以上を入力してください`, true);
        return;
      }
      input.classList.remove('border-red-400');
      pendingBid = val;
      document.getElementById('confirmTitle').textContent = auction.title;
      document.getElementById('confirmCurrentPrice').textContent = '¥' + auction.current_price.toLocaleString();
      document.getElementById('confirmBidPrice').textContent = '¥' + val.toLocaleString();
      document.getElementById('bidModal').classList.remove('hidden');
      document.getElementById('bidModal').classList.add('flex');
    }

    function closeBidModal() {
      document.getElementById('bidModal').classList.add('hidden');
      document.getElementById('bidModal').classList.remove('flex');
    }

    async function confirmBid() {
      const btn = document.getElementById('confirmBidBtn');
      btn.textContent = '処理中...';
      btn.disabled = true;

      try {
        const res = await fetch(`/api/auctions/${auctionId}/bids`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ amount: pendingBid })
        });
        const data = await res.json();
        closeBidModal();

        if (!res.ok) {
          showToast('❌ ' + data.error, true);
          return;
        }

        updatePriceDisplay(data.new_price, data.bid_count, data.bidder_count);
        if (data.extended) updateEndTime(data.end_time);

        // ステータス更新
        const statusBox = document.getElementById('bidStatusBox');
        if (statusBox) {
          statusBox.className = 'winning border rounded-lg p-3 flex items-center gap-2 mb-3';
          statusBox.innerHTML = `
            <svg class="w-4 h-4 text-gold flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
            <p class="text-sm text-gold font-medium" id="bidStatusText">現在の最高入札者です（¥${data.new_price.toLocaleString()}）</p>`;
        }

        document.getElementById('bidInput').value = '';
        showToast('✅ ' + data.message);
      } catch(e) {
        showToast('❌ 通信エラーが発生しました', true);
      } finally {
        btn.textContent = '入札する';
        btn.disabled = false;
      }
    }

    // 入札履歴
    async function openHistory() {
      document.getElementById('historyModal').classList.remove('hidden');
      document.getElementById('historySubtitle').textContent = '読み込み中...';
      document.getElementById('historyStats').innerHTML = '';
      document.getElementById('historyList').innerHTML = '<p class="text-center text-white/30 py-8">読み込み中...</p>';

      try {
        const res = await fetch(`/api/auctions/${auctionId}/bids`);
        const data = await res.json();
        const bids = data.bids || [];
        const a = data.auction;

        document.getElementById('historySubtitle').textContent = `${bids.length}件の入札`;
        document.getElementById('historyStats').innerHTML = `
          <div><p class="text-white/40 text-xs mb-1">開始価格</p><p class="font-bold text-white/90">¥${a.starting_price.toLocaleString()}</p></div>
          <div><p class="text-white/40 text-xs mb-1">現在の価格</p><p class="font-bold text-gold text-lg font-serif">¥${a.current_price.toLocaleString()}</p></div>
          <div><p class="text-white/40 text-xs mb-1">上昇率</p><p class="font-bold text-gold">+${Math.round((a.current_price - a.starting_price) / a.starting_price * 100)}%</p></div>`;

        if (!bids.length) {
          document.getElementById('historyList').innerHTML = '<p class="text-center text-white/30 py-8">まだ入札はありません</p>';
          return;
        }

        document.getElementById('historyList').innerHTML = `
          <table class="w-full text-sm">
            <thead class="bg-dark-700 sticky top-0"><tr class="text-xs text-white/40">
              <th class="text-left px-4 py-2 font-medium">入札者</th>
              <th class="text-right px-4 py-2 font-medium">金額</th>
              <th class="text-right px-4 py-2 font-medium">日時</th>
            </tr></thead>
            <tbody>
              ${bids.map((bid, i) => `
                <tr class="bid-row border-b border-white/5">
                  <td class="px-4 py-3">
                    <div class="flex items-center gap-2">
                      <div class="w-7 h-7 rounded-full bg-gold/10 flex items-center justify-center text-gold text-xs font-bold">
                        ${bid.display_name[0].toUpperCase()}
                      </div>
                      <div>
                        <span class="text-white/70">${bid.display_name}</span>
                        ${bid.is_highest ? '<span class="ml-1 text-xs bg-gold/10 text-gold px-1.5 rounded border border-gold/20">最高入札</span>' : ''}
                      </div>
                    </div>
                  </td>
                  <td class="px-4 py-3 text-right ${bid.is_highest ? 'font-bold text-white/90' : 'text-white/60'}">¥${bid.amount.toLocaleString()}</td>
                  <td class="px-4 py-3 text-right text-white/30 text-xs">${formatRelativeTime(bid.created_at)}</td>
                </tr>`).join('')}
            </tbody>
          </table>`;
      } catch(e) {
        document.getElementById('historyList').innerHTML = '<p class="text-center text-red-400 py-8">読み込みに失敗しました</p>';
      }
    }

    function closeHistory() {
      document.getElementById('historyModal').classList.add('hidden');
    }

    // ウォッチリスト
    async function toggleWatch() {
      if (!currentUser) { location.href = '/login'; return; }
      try {
        const res = await fetch(`/api/auctions/${auctionId}/watch`, {
          method: 'POST', headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        const icon = document.getElementById('watchIcon');
        if (data.watched) {
          icon.setAttribute('fill', '#A78450');
          icon.setAttribute('stroke', '#A78450');
          showToast('❤️ ウォッチリストに追加しました');
        } else {
          icon.setAttribute('fill', 'none');
          icon.setAttribute('stroke', 'currentColor');
          showToast('ウォッチリストから削除しました');
        }
      } catch(e) {}
    }

    // 抜かれ通知（目立つバナー）
    function showOutbidNotification(newPrice) {
      const banner = document.createElement('div');
      banner.className = 'fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-red-900/90 border border-red-500/30 text-white px-6 py-4 rounded-xl shadow-2xl text-sm font-medium max-w-sm w-full mx-4 fade-in';
      banner.innerHTML = `
        <div class="flex items-start gap-3">
          <span class="text-xl flex-shrink-0">⚠️</span>
          <div>
            <p class="font-bold mb-1">入札を上回られました！</p>
            <p class="text-red-200">現在の最高入札額: ¥${newPrice.toLocaleString()}</p>
            <p class="text-red-300 text-xs mt-1">入札を続けますか？</p>
          </div>
          <button onclick="this.parentElement.parentElement.remove()" class="ml-auto text-red-300 hover:text-white flex-shrink-0">✕</button>
        </div>`;
      document.body.appendChild(banner);
      setTimeout(() => banner.remove(), 8000);
    }

    // 画像サムネイル切り替え
    function switchImage(url, btn) {
      const mainImg = document.getElementById('mainImg');
      if (mainImg) mainImg.src = url;
      document.querySelectorAll('#mainImageBox ~ div button').forEach(b => b.classList.replace('border-gold','border-white/10'));
      if (btn) btn.classList.replace('border-white/10','border-gold');
    }

    // トースト
    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = `fixed bottom-6 left-1/2 -translate-x-1/2 ${isError ? 'bg-red-900/90 border-red-500/30' : 'bg-dark-800 border-white/10'} border text-white px-6 py-3 rounded-full text-sm font-medium shadow-lg z-50 transition-all max-w-sm text-center`;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 3500);
    }

    // ユーティリティ
    function formatEndDate(dateStr) {
      const d = new Date(dateStr);
      return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} 終了予定`;
    }

    function formatRelativeTime(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const m = Math.floor(diff / 60000);
      const h = Math.floor(m / 60);
      const day = Math.floor(h / 24);
      if (day > 0) return `${day}日前`;
      if (h > 0) return `${h}時間前`;
      if (m > 0) return `${m}分前`;
      return 'たった今';
    }

    // 初期ロード
    loadAuction();
  </script>
</body>
</html>
